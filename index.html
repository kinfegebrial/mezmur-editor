<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#081D42">
<title>ደብረ ብሥራት — Mezmur editor</title>
<style>
  :root {
    --navy: #0F326A; --navy-deep: #081D42; --sky: #3F74D6; --gold: #F2C25B; --gold-deep: #9A6A10; --snow: #F7FAFF;
    --bg: #F5F8FE; --card: #FFFFFF; --text: #0E1A33; --soft: #4A5670; --line: #D6DEEE;
    --tint: #E7EEFB; --danger: #B3261E; --ok: #1B7466; --warn-bg: #FBEFD2; --warn-text: #3A2A05;
    --shadow: 0 2px 10px rgba(14, 26, 51, .08);
    --serif: Georgia, "Noto Serif Ethiopic", "Abyssinica SIL", "Nyala", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0A1222; --card: #101A2E; --text: #E6ECF8; --soft: #B6C2DA; --line: #2A3856;
      --tint: #1A2744; --danger: #FF8A80; --ok: #7CCFC0; --warn-bg: #3F3212; --warn-text: #FBEFD2;
      --gold-deep: #F2C25B; --shadow: 0 6px 22px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, "Noto Sans Ethiopic", "Nyala", sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  svg.i { width: 22px; height: 22px; fill: currentColor; flex: none; display: block; }
  .blue { background: linear-gradient(125deg, var(--navy-deep), var(--navy) 62%, #1B4FA3); color: var(--snow); position: relative; overflow: hidden; }
  /* the faint diamond lattice of the app, over every blue surface */
  .blue::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .06;
    background: repeating-linear-gradient(45deg, #fff 0 1px, transparent 1px 30px), repeating-linear-gradient(-45deg, #fff 0 1px, transparent 1px 30px); }
  .blue > * { position: relative; }

  /* ---------- the top bar ---------- */
  #top { position: sticky; top: 0; z-index: 10; border-radius: 0 0 24px 24px; padding: calc(8px + env(safe-area-inset-top)) 14px 12px; box-shadow: var(--shadow); }
  .bar { display: flex; align-items: center; gap: 10px; max-width: 1180px; margin: 0 auto; }
  #logo { width: 44px; height: 44px; border-radius: 50%; flex: none; box-shadow: 0 0 0 2px var(--gold); }
  .who { flex: 1; min-width: 0; }
  #heading { font: 600 20px/1.2 var(--serif); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status { font-size: 12.5px; color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 17px; }
  .iconbtn { background: rgba(255,255,255,.15); border: 0; color: var(--snow); border-radius: 50%; width: 42px; height: 42px; display: grid; place-items: center; flex: none; }
  .publish { background: var(--gold); color: var(--navy-deep); border: 0; border-radius: 999px; height: 42px; padding: 0 16px 0 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; flex: none; }
  .publish[disabled] { opacity: .4; cursor: default; }
  .publish b { background: var(--navy-deep); color: var(--gold); border-radius: 999px; min-width: 22px; height: 22px; padding: 0 6px; font-size: 12px; display: grid; place-items: center; }
  #deskNav { display: none; gap: 4px; margin-right: 8px; }
  #deskNav button { background: transparent; border: 0; color: var(--snow); opacity: .78; padding: 9px 14px; border-radius: 999px; font-weight: 600; display: flex; gap: 7px; align-items: center; }
  #deskNav button.on { background: rgba(255,255,255,.16); opacity: 1; }
  #deskNav svg.i { width: 19px; height: 19px; }

  /* ---------- the bottom tabs (phone) ---------- */
  #tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; background: var(--card); border-top: 1px solid var(--line); display: flex; padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); }
  #tabs button { flex: 1; background: transparent; border: 0; color: var(--soft); display: grid; justify-items: center; gap: 2px; font-size: 12px; font-weight: 600; padding: 4px 0; }
  #tabs button span { display: grid; place-items: center; width: 58px; height: 30px; border-radius: 999px; }
  #tabs button.on { color: var(--navy); }
  #tabs button.on span { background: var(--tint); }
  @media (prefers-color-scheme: dark) { #tabs button.on { color: var(--gold); } }
  @media (min-width: 900px) { #tabs { display: none; } #deskNav { display: flex; } }

  main { max-width: 1180px; margin: 0 auto; padding: 16px 14px 120px; }
  @media (min-width: 900px) { main { padding: 22px 22px 60px; } }
  h2.sec { font: 600 19px/1.3 var(--serif); margin: 26px 0 12px; display: flex; align-items: center; gap: 10px; }
  h2.sec::before { content: ""; width: 5px; height: 22px; border-radius: 9px; background: linear-gradient(var(--gold), var(--gold-deep)); }
  h2.sec small { font: 400 13px system-ui, sans-serif; color: var(--soft); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .card h3 { margin: 0 0 4px; font: 600 17px var(--serif); }
  .hint { color: var(--soft); font-size: 14px; margin: 4px 0 0; }
  .warn { background: var(--warn-bg); color: var(--warn-text); border-radius: 16px; padding: 11px 14px; margin-bottom: 14px; font-size: 14px; display: flex; gap: 10px; align-items: center; }
  .field, select.field, textarea.field { width: 100%; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 11px 13px; }
  .field:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(242,194,91,.28); }
  .btn { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 10px 16px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; justify-content: center; }
  .btn svg.i { width: 19px; height: 19px; }
  .btn.main { background: var(--navy); border-color: var(--navy); color: #fff; }
  .btn.gold { background: var(--gold); border-color: transparent; color: var(--navy-deep); }
  .btn.danger { color: var(--danger); }
  .btn.small { padding: 7px 12px; font-size: 14px; }
  .btn[disabled] { opacity: .45; cursor: default; }
  .rowwrap { display: flex; flex-wrap: wrap; gap: 8px; }

  /* ---------- home ---------- */
  .hero { border-radius: 28px; padding: 22px 20px 20px; box-shadow: var(--shadow); }
  .hero .over { font-size: 13px; color: var(--gold); font-weight: 600; }
  .hero h1 { font: 600 34px/1.15 var(--serif); margin: 4px 0 10px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; background: var(--gold); color: var(--navy-deep); border-radius: 999px; padding: 4px 12px; font-weight: 700; font-size: 13px; }
  .hero .note { margin-top: 8px; font-size: 14px; opacity: .9; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; margin-top: 16px; }
  .stat { background: rgba(255,255,255,.12); border-radius: 16px; padding: 10px 4px; text-align: center; }
  .stat b { display: block; font: 600 24px var(--serif); }
  .stat span { font-size: 12px; color: var(--gold); }
  .unsent { background: var(--gold); color: var(--navy-deep); border-radius: 22px; padding: 14px 16px; margin-top: 14px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow); }
  .unsent .what { flex: 1; min-width: 0; }
  .unsent b { font: 600 17px var(--serif); display: block; }
  .unsent small { font-size: 13px; opacity: .85; }
  .unsent .btn { border-color: transparent; background: var(--navy-deep); color: var(--gold); }
  .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .quick button { border: 0; border-radius: 20px; padding: 14px; color: #fff; text-align: left; display: flex; align-items: center; gap: 10px; font-weight: 700; box-shadow: var(--shadow); }
  .quick button svg.i { background: rgba(255,255,255,.24); border-radius: 50%; width: 36px; height: 36px; padding: 7px; }
  .quick small { display: block; font-weight: 400; font-size: 12px; opacity: .85; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 10px; }
  .tile { border: 0; border-radius: 20px; min-height: 84px; padding: 12px 14px; color: #fff; text-align: left; position: relative; overflow: hidden; box-shadow: var(--shadow); }
  .tile b { font: 600 16px/1.25 var(--serif); display: block; }
  .tile span { font-size: 12.5px; opacity: .88; }
  .tile svg.i { position: absolute; right: -8px; bottom: -10px; width: 62px; height: 62px; opacity: .16; }
  .checks button { display: flex; width: 100%; align-items: center; gap: 12px; background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 12px 2px; text-align: left; }
  .checks button:last-child { border-bottom: 0; }
  .checks b { margin-left: auto; background: var(--tint); border-radius: 999px; padding: 2px 11px; font-size: 14px; }
  .dot { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: #fff; flex: none; }

  /* ---------- the list ---------- */
  .tools { position: sticky; top: 74px; z-index: 5; background: var(--bg); padding: 4px 0 10px; margin: -4px 0 4px; }
  .searchbox { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 6px 4px 14px; box-shadow: var(--shadow); }
  .searchbox input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 9px 0; outline: none; }
  .searchbox .btn { padding: 8px 14px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 14px; color: var(--soft); white-space: nowrap; }
  .chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .chip b { font-weight: 700; opacity: .75; margin-left: 4px; }
  select.chip { padding-right: 8px; max-width: 190px; }
  .rows { background: var(--card); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; box-shadow: var(--shadow); }
  .row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 10px 12px; }
  .row:last-child { border-bottom: 0; }
  .row:hover { background: var(--tint); }
  .num { flex: none; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-weight: 700; font-size: 14px; color: #fff; }
  .row .what { flex: 1; min-width: 0; }
  .row .title { font: 600 16.5px var(--serif); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .sub { color: var(--soft); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.gone .title { text-decoration: line-through; opacity: .6; }
  .row > svg.i { color: var(--line); }
  .tag { flex: none; font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 3px 9px; background: var(--tint); color: var(--soft); display: inline-flex; align-items: center; gap: 3px; }
  .tag svg.i { width: 13px; height: 13px; }
  .tag.edited { background: var(--gold); color: var(--navy-deep); }
  .tag.new { background: var(--ok); color: #fff; }
  .tag.deleted { background: var(--danger); color: #fff; }
  .empty { padding: 44px 16px; text-align: center; color: var(--soft); }
  .empty svg.i { width: 54px; height: 54px; margin: 0 auto 10px; color: var(--line); }

  /* ---------- the form ---------- */
  .split { display: grid; gap: 18px; }
  .panes { display: flex; background: var(--tint); border-radius: 999px; padding: 4px; margin-bottom: 14px; }
  .panes button { flex: 1; border: 0; background: transparent; border-radius: 999px; padding: 9px; font-weight: 700; color: var(--soft); display: flex; gap: 7px; justify-content: center; align-items: center; }
  .panes button.on { background: var(--navy); color: #fff; }
  .split[data-show="edit"] .previewPane, .split[data-show="preview"] .formPane { display: none; }
  @media (min-width: 980px) {
    .split { grid-template-columns: minmax(0, 1fr) 390px; align-items: start; }
    .split[data-show] .previewPane, .split[data-show] .formPane { display: block; }
    .previewPane { position: sticky; top: 92px; }
    .panes { display: none; }
  }
  label.f { display: block; font-weight: 700; font-size: 14px; margin: 14px 0 5px; }
  label.f small { font-weight: 400; color: var(--soft); }
  textarea.field { min-height: 110px; resize: vertical; line-height: 1.7; }
  textarea.words { min-height: 340px; font: 17px/1.8 var(--serif); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .two { grid-template-columns: 1fr; } }
  .error { color: var(--danger); font-size: 14px; margin-top: 6px; font-weight: 600; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--soft); }
  .wordshead { display: flex; align-items: center; gap: 10px; }
  .seg { display: inline-flex; background: var(--tint); border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: transparent; border-radius: 999px; padding: 7px 14px; color: var(--soft); font-weight: 700; font-size: 14px; }
  .seg button.on { background: var(--navy); color: #fff; }
  .part { border: 1.5px solid var(--line); border-radius: 18px; padding: 10px; margin-top: 10px; background: var(--bg); }
  .part.chorus { border-color: var(--gold); background: var(--warn-bg); }
  .part.mark { border-style: dashed; padding-bottom: 4px; }
  .parthead { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .plabel { font: 600 15px var(--serif); flex: 1; }
  .part.chorus .plabel { color: var(--gold-deep); }
  .seg.kind { display: flex; margin-bottom: 8px; background: var(--card); border: 1.5px solid var(--line); }
  .seg.kind button { flex: 1; padding: 8px 6px; font: 600 15px var(--serif); }
  .part.chorus .seg.kind button.on { background: var(--gold); color: var(--navy-deep); }
  .mini { flex: none; border: 1.5px solid var(--line); background: var(--card); border-radius: 11px; min-width: 36px; height: 36px; padding: 0 8px; font-size: 14px; font-weight: 600; display: grid; place-items: center; }
  .mini svg.i { width: 18px; height: 18px; }
  .mini[disabled] { opacity: .35; }
  .mini.danger { color: var(--danger); }
  .part textarea.field { min-height: 92px; font: 17px/1.8 var(--serif); overflow: hidden; resize: none; }
  .linetools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 6px; font-size: 13px; color: var(--soft); }
  .actions { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); z-index: 9; box-shadow: 0 -6px 22px rgba(15,50,106,.08); }
  .actions .in { max-width: 1180px; margin: 0 auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .actions .btn.main { flex: 1; min-width: 130px; }
  .actions .saved { font-size: 13px; color: var(--soft); display: flex; gap: 5px; align-items: center; }

  /* ---------- the preview: the mezmur as the app shows it ---------- */
  .phone { border-radius: 34px; border: 8px solid var(--navy-deep); background: var(--bg); overflow: hidden; box-shadow: var(--shadow); max-width: 400px; margin: 0 auto; }
  .phone .scroll { max-height: min(74vh, 720px); overflow: auto; }
  .phead { padding: 44px 20px 18px; color: #fff; position: relative; overflow: hidden; }
  .phead svg.i { position: absolute; right: -18px; top: -6px; width: 150px; height: 150px; opacity: .13; }
  .phead .pchip { display: inline-block; background: var(--gold); color: var(--navy-deep); font-weight: 700; font-size: 13px; border-radius: 999px; padding: 4px 12px; }
  .phead h3 { font: 600 27px/1.25 var(--serif); margin: 10px 0 2px; }
  .phead .pwhom { color: var(--gold); font-weight: 600; font-size: 14px; }
  .pbody { padding: 18px 18px 26px; font: 17px/1.85 var(--serif); }
  .orn { text-align: center; color: var(--gold-deep); letter-spacing: 6px; margin: 0 0 14px; font-size: 13px; }
  .pverse { display: flex; gap: 10px; margin-bottom: 18px; }
  .pverse .no { flex: none; width: 26px; height: 26px; margin-top: 4px; border-radius: 50%; border: 1.5px solid var(--gold-deep); color: var(--gold-deep); font: 600 13px var(--serif); display: grid; place-items: center; }
  .pverse .lines { flex: 1; min-width: 0; }
  .pchorus { background: var(--warn-bg); border: 1px solid rgba(154,106,16,.25); border-radius: 20px; padding: 10px 16px 12px; margin-bottom: 18px; font-weight: 600; }
  .pchorus .pname { font: 700 13px system-ui, sans-serif; color: var(--gold-deep); }
  .pline { display: flex; gap: 12px; justify-content: space-between; }
  .pline .answer { color: var(--gold-deep); text-align: right; flex: none; max-width: 45%; }
  .times { font: 700 12px system-ui, sans-serif; color: var(--gold-deep); margin-left: 6px; }
  .pmark { text-align: center; margin-bottom: 18px; }
  .pmark span { display: inline-block; font: 700 13px system-ui, sans-serif; color: var(--gold-deep); border: 1px solid rgba(154,106,16,.45); border-radius: 999px; padding: 4px 14px; }
  .ptrans { background: rgba(27,116,102,.12); border-radius: 20px; padding: 12px 16px; font: 15.5px/1.7 system-ui, sans-serif; }
  .ptrans b { display: block; color: var(--ok); font-size: 13px; margin-bottom: 2px; }
  .pempty { color: var(--soft); text-align: center; font: 14px system-ui, sans-serif; padding: 20px 0; }

  /* ---------- history ---------- */
  .ver { display: flex; gap: 14px; align-items: flex-start; }
  .ver .badge { flex: none; width: 54px; height: 54px; border-radius: 17px; display: grid; place-items: center; color: #fff; font: 600 19px var(--serif); background: linear-gradient(135deg, var(--sky), var(--navy)); }
  .ver.now .badge { background: var(--gold); color: var(--navy-deep); }
  .ver .what { flex: 1; min-width: 0; }
  .ver .what b { font: 600 16px var(--serif); display: block; }
  .ver .what small { color: var(--soft); font-size: 13px; }

  /* ---------- sheets and toasts ---------- */
  .shade { position: fixed; inset: 0; background: rgba(4,10,24,.55); z-index: 20; display: grid; place-items: end center; animation: fade .18s; }
  @media (min-width: 620px) { .shade { place-items: center; } }
  .sheet { background: var(--card); width: min(560px, 100%); max-height: 88vh; overflow: auto; border-radius: 26px 26px 0 0; padding: 20px 20px calc(20px + env(safe-area-inset-bottom)); animation: rise .22s; }
  @media (min-width: 620px) { .sheet { border-radius: 26px; } }
  .sheet h2 { margin: 0 0 8px; font: 600 20px var(--serif); }
  .sheet .list { margin: 8px 0; padding-left: 20px; }
  .sheet .foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 18px; }
  .steps { margin: 12px 0 0; padding: 0; list-style: none; }
  .steps li { display: flex; gap: 8px; align-items: center; padding: 4px 0; color: var(--soft); }
  .steps li.done { color: var(--ok); }
  .toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--navy-deep); color: #fff; padding: 12px 18px; border-radius: 18px; z-index: 30; max-width: 92vw; text-align: center; box-shadow: 0 8px 26px rgba(0,0,0,.35); animation: rise .2s; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  .toast { animation-name: toastin; }
  @keyframes toastin { from { opacity: 0; transform: translate(-50%, 14px); } }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header id="top" class="blue">
  <div class="bar">
    <button class="iconbtn" id="back" hidden aria-label="Back"></button>
    <img id="logo" alt="">
    <div class="who">
      <div id="heading">ደብረ ብሥራት</div>
      <div id="status"></div>
    </div>
    <nav id="deskNav"></nav>
    <button class="publish" id="publish" disabled></button>
  </div>
</header>
<main id="app"></main>
<nav id="tabs"></nav>

/*
 * The editor of the online mezmur book (see ONLINE_GUIDE.md in the project).
 *
 * The book is one file, mezmurs.json, in a private GitHub repository. This page reads
 * it with your key, lets you change mezmurs, and "Publish" writes it back with the
 * version number raised by one. The app on every phone then downloads the new book.
 *
 * This page itself holds no mezmurs and no key, so it is safe on a public web address.
 *
 * Nothing is sent anywhere except to GitHub. Changes that are not published yet are
 * kept in this browser, so you can also work without internet and publish later.
 */
const API = "https://api.github.com";
const BOOK_FILE = "mezmurs.json";
const VERSION_FILE = "version.json";

// ---------- what this browser remembers ----------
const memory = {};
let storageWorks = true;
function recall(key, fallback) {
  try {
    const text = localStorage.getItem("mezmur." + key);
    return text == null ? fallback : JSON.parse(text);
  } catch (problem) {
    storageWorks = false;
    return key in memory ? memory[key] : fallback;
  }
}
function remember(key, value) {
  memory[key] = value;
  try { localStorage.setItem("mezmur." + key, JSON.stringify(value)); } catch (problem) { storageWorks = false; }
}

function emptyDraft() { return { changed: {}, before: {}, deleted: [], whole: null }; }

/**
 * On a github.io page the owner is in the address. The editor page lives in the
 * repository "mezmur-editor" and the book in "mezmur": the name without "-editor".
 */
function guessConnection() {
  const host = location.hostname;
  if (!host.endsWith(".github.io")) return { owner: "", repo: "mezmur", token: "" };
  const owner = host.split(".")[0];
  const folder = location.pathname.split("/").filter(Boolean)[0] || "";
  const repo = !folder || folder.endsWith(".html") ? "mezmur" : folder.replace(/-editor$/, "");
  return { owner: owner, repo: repo, token: "" };
}

let conn = recall("conn", null) || guessConnection();
let base = recall("base", null);          // the book as it is online (the last time it was read)
let draft = recall("draft", null) || emptyDraft();   // my changes that are not published yet
let online = false;                       // true when "base" was read from GitHub in this visit
let busy = "";                            // a short text while something is loading
let listState = { kind: "mezmur", section: "", query: "", filter: "all", scroll: 0 };

function keepDraft() { remember("draft", draft); view = null; }

// ---------- the book with my changes on top ----------
function source() { return draft.whole || base; }

function sectionIndex(book, name) {
  const at = (book.categories || []).indexOf(name);
  return at < 0 ? 999 : at;
}

/** Mezmurs in the order of the sections and then by number; wereb after them. */
function sorted(book, songs) {
  return songs.map(function (song, at) { return { song: song, at: at }; }).sort(function (a, b) {
    const wa = a.song.k === "wereb" ? 1 : 0, wb = b.song.k === "wereb" ? 1 : 0;
    if (wa !== wb) return wa - wb;
    if (!wa) {
      const sa = sectionIndex(book, a.song.c), sb = sectionIndex(book, b.song.c);
      if (sa !== sb) return sa - sb;
    }
    return (a.song.n - b.song.n) || (a.at - b.at);
  }).map(function (item) { return item.song; });
}

/** Puts the changes of a draft into a book (used for showing and for publishing). */
function applyDraft(book, changes) {
  const gone = new Set(changes.deleted);
  const known = new Set(book.songs.map(function (song) { return song.id; }));
  let songs = book.songs.filter(function (song) { return !gone.has(song.id); })
    .map(function (song) { return changes.changed[song.id] || song; });
  for (const id in changes.changed) if (!known.has(id)) songs.push(changes.changed[id]);
  book.songs = sorted(book, songs);
  return book;
}

/** Every row of the list: the song as I have it now, and what I did to it. */
let view = null;
function rows() {
  if (view) return view;
  const book = source();
  if (!book) return [];
  const gone = new Set(draft.deleted);
  const known = new Set();
  const list = [];
  for (const song of book.songs) {
    known.add(song.id);
    if (gone.has(song.id)) list.push({ song: song, state: "deleted" });
    else if (draft.changed[song.id]) list.push({ song: draft.changed[song.id], state: "edited" });
    else list.push({ song: song, state: "" });
  }
  for (const id in draft.changed) if (!known.has(id)) list.push({ song: draft.changed[id], state: "new" });
  const order = new Map(sorted(book, list.map(function (row) { return row.song; })).map(function (song, at) { return [song.id, at]; }));
  view = list.sort(function (a, b) { return order.get(a.song.id) - order.get(b.song.id); });
  return view;
}

function countChanges() {
  let edited = 0, added = 0;
  const book = source();
  const known = new Set(book ? book.songs.map(function (song) { return song.id; }) : []);
  for (const id in draft.changed) if (known.has(id)) edited++; else added++;
  return { edited: edited, added: added, deleted: draft.deleted.length, whole: !!draft.whole,
           total: edited + added + draft.deleted.length + (draft.whole ? 1 : 0) };
}

// ---------- GitHub ----------
function toBase64(text) {
  const bytes = new TextEncoder().encode(text);
  let binary = "";
  for (let i = 0; i < bytes.length; i += 0x8000) binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(binary);
}
function fromBase64(encoded) {
  const binary = atob(encoded.replace(/\s/g, ""));
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}

function plainError(status) {
  if (status === 401) return "The key is wrong or has expired. Open Connection and paste a new key.";
  if (status === 403) return "GitHub refused. The key may not have permission for this repository (it needs Contents: Read and write), or there were too many tries. Wait a few minutes.";
  if (status === 404) return conn.token
    ? "Not found. Check the user name and the repository name in Connection. If they are right, the key is not allowed to open this repository."
    : "The book is private: it can only be read with the key. Add the key in Connection.";
  return "GitHub answered with an error (" + status + "). Try again in a minute.";
}

async function github(path, options) {
  options = options || {};
  const headers = Object.assign({ "Accept": "application/vnd.github+json" }, options.headers || {});
  if (conn.token) headers["Authorization"] = "Bearer " + conn.token;
  const address = API + "/repos/" + encodeURIComponent(conn.owner) + "/" + encodeURIComponent(conn.repo) + "/contents/" + path;
  let reply;
  try {
    reply = await fetch(address, { method: options.method || "GET", headers: headers, body: options.body, cache: "no-store" });
  } catch (problem) {
    const failed = new Error("No internet connection (or GitHub cannot be reached).");
    failed.offline = true;
    throw failed;
  }
  return reply;
}

/** The text of a file and its "sha" (GitHub needs the sha to replace the file). Null when there is no such file. */
async function readFile(path) {
  const reply = await github(path);
  if (reply.status === 404) return null;
  if (!reply.ok) throw new Error(plainError(reply.status));
  const info = await reply.json();
  let text;
  if (info.content) {
    text = fromBase64(info.content);
  } else {   // a file over 1 MB comes without its content: ask for it raw
    const raw = await github(path, { headers: { "Accept": "application/vnd.github.raw+json" } });
    if (!raw.ok) throw new Error(plainError(raw.status));
    text = await raw.text();
  }
  return { text: text, sha: info.sha };
}

async function writeFile(path, text, sha, message) {
  const body = { message: message, content: toBase64(text) };
  if (sha) body.sha = sha;
  const reply = await github(path, { method: "PUT", body: JSON.stringify(body) });
  if (reply.status === 409 || reply.status === 422) {
    const clash = new Error("Someone else published at the same moment.");
    clash.clash = true;
    throw clash;
  }
  if (!reply.ok) throw new Error(plainError(reply.status));
}

/*
 * The fingerprint of a mezmur: a short code made from everything about it (title,
 * words, section, picture ...). When anything changes, the code changes. The app makes
 * the same code from the mezmurs on the phone, and compares: so before downloading it
 * can say exactly which mezmurs are new, corrected or removed, each one only once, even
 * when several versions were skipped. tools/online.py and the app (Fingerprint.kt) make
 * the same code: FNV-1a of the fields below, joined by the character U+001F.
 */
function fingerprint(song) {
  const text = function (value, missing) { return value == null ? missing : String(value); };
  const whole = function (value) { return String(parseInt(value, 10) || 0); };
  const fields = [text(song.id, ""), whole(song.n), text(song.t, ""), text(song.c, ""), text(song.s, ""), text(song.l, ""),
    text(song.tr, ""), text(song.k, "mezmur"), text(song.o, ""), text(song.a, ""), text(song.img, ""), text(song.w, ""),
    text(song.w2, ""), whole(song.ch)].join("\u001f");
  let hash = 0x811c9dc5;
  for (let i = 0; i < fields.length; i++) {
    hash ^= fields.charCodeAt(i);
    hash = Math.imul(hash, 0x01000193) >>> 0;
  }
  return hash.toString(16).padStart(8, "0");
}

/**
 * The small file the app reads every day: the version, the note, how big the book is,
 * and one line per mezmur (its code, fingerprint, title and number).
 */
function versionText(book) {
  return JSON.stringify({
    rev: book.rev || 1, updated: book.updated || "", songs: book.songs.length, note: book.note || "",
    size: new TextEncoder().encode(JSON.stringify(book)).length,
    index: book.songs.map(function (song) { return [song.id, fingerprint(song), song.t, parseInt(song.n, 10) || 0]; }),
  });
}

/** The small file the app reads first. Written again whenever it does not match the book. */
async function matchVersionFile(book) {
  const now = await readFile(VERSION_FILE);
  const wanted = versionText(book);
  if (now && now.text === wanted) return;
  await writeFile(VERSION_FILE, wanted, now ? now.sha : null, "Version " + (book.rev || 1));
}

async function loadOnline(quiet) {
  if (!conn.owner || !conn.repo) return;
  busy = "Reading the book from GitHub…";
  paintStatus();
  try {
    const file = await readFile(BOOK_FILE);
    if (!file) {
      busy = "";
      online = false;
      if (!quiet || !base) toast(conn.token ? "The book (mezmurs.json) was not found. Check the names in Connection, or open a backup file and publish it." : plainError(404));
    } else {
      base = JSON.parse(file.text);
      remember("base", base);
      online = true;
      view = null;
      busy = "";
      if (conn.token) matchVersionFile(base).catch(function () {});
    }
  } catch (problem) {
    busy = "";
    online = false;
    if (!quiet || !base) toast(problem.message);
  }
  render();
}

/** The date on this device, like 2026-11-15. */
function today() {
  const now = new Date();
  return now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
}

/**
 * Publishing: read the newest book again, put my changes on top of it, raise the
 * version by one, and write it. So changes that another person published while I
 * was working are kept; only the mezmurs I touched are replaced.
 */
async function publish(note, onStep) {
  for (let attempt = 1; attempt <= 3; attempt++) {
    onStep("Reading the newest book…");
    const file = await readFile(BOOK_FILE);
    const newest = file ? JSON.parse(file.text) : null;
    const book = draft.whole ? JSON.parse(JSON.stringify(draft.whole)) : newest;
    if (!book) throw new Error("There is no book online yet. Open a backup file first (Home → Tools).");
    applyDraft(book, draft);
    book.rev = Math.max(newest ? (newest.rev || 0) : 0, book.rev || 0) + 1;
    book.updated = today();
    book.note = note || "";
    onStep("Sending version " + book.rev + "…");
    try {
      await writeFile(BOOK_FILE, JSON.stringify(book), file ? file.sha : null, "Version " + book.rev + (note ? ": " + note : ""));
    } catch (problem) {
      if (problem.clash && attempt < 3) continue;   // someone else was faster: start again from their book
      throw problem;
    }
    base = book;
    remember("base", base);
    draft = emptyDraft();
    keepDraft();
    online = true;
    onStep("Almost done…");
    let last = null;
    for (let i = 0; i < 3; i++) {
      try { await matchVersionFile(book); last = null; break; } catch (problem) { last = problem; }
    }
    if (last) throw new Error("The book was sent, but the small version file was not. Press “Read again from online” on the home page; it will be repaired.");
    return book.rev;
  }
}

/** Mezmurs I changed that someone else also changed online after I read the book. */
async function findClashes() {
  if (draft.whole) return [];
  const file = await readFile(BOOK_FILE);
  if (!file) return [];
  const newest = JSON.parse(file.text);
  const byId = new Map(newest.songs.map(function (song) { return [song.id, song]; }));
  const clashes = [];
  const mine = Object.keys(draft.changed).concat(draft.deleted);
  for (const id of mine) {
    const was = draft.before[id];
    const now = byId.get(id);
    if (was && now && JSON.stringify(was) !== JSON.stringify(now)) clashes.push(now.t + " (" + now.n + ")");
    if (was && !now) clashes.push(was.t + " (" + was.n + ") — deleted online");
  }
  return clashes;
}

// ---------- drawing ----------
function h(tag, props) {
  const el = document.createElement(tag);
  let value;
  for (const key in (props || {})) {
    const v = props[key];
    if (v == null || v === false) continue;
    if (key === "class") el.className = v;
    else if (key === "value") value = v;
    else if (key.slice(0, 2) === "on") el.addEventListener(key.slice(2), v);
    else if (key === "checked" || key === "disabled" || key === "hidden") el[key] = true;
    else el.setAttribute(key, v);
  }
  for (let i = 2; i < arguments.length; i++) {
    const kids = Array.isArray(arguments[i]) ? arguments[i] : [arguments[i]];
    for (const kid of kids) {
      if (kid == null || kid === false) continue;
      el.appendChild(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
  }
  if (value !== undefined) el.value = value;
  return el;
}

function icon(name, extra) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("class", "i" + (extra ? " " + extra : ""));

  path.setAttribute("d", ICONS[name]);
  svg.appendChild(path);
  return svg;
}

/** The two colors of a section: the same ones the app uses for it. */
function sectionColors(name) {
  const has = function (word) { return (name || "").indexOf(word) >= 0; };
  if (has("ርገት")) return ["#6FB1E8", "#2E6FB5"];
  if (has("ሰርግ") || has("ሠርግ")) return ["#CB5F86", "#6B1F3D"];
  if (has("ማርያም")) return ["#4C9BE8", "#1B4FA3"];
  if (has("መላእክት")) return ["#7D62D1", "#38247F"];
  if (has("ቅዱሳን")) return ["#CF7F4C", "#6E3414"];
  if (has("ሕማማት")) return ["#96304F", "#3E0E22"];
  if (has("መስቀል")) return ["#DB5C3B", "#7A1F12"];
  if (has("ልደት")) return ["#4455B5", "#151B55"];
  if (has("ጥምቀት")) return ["#2FA8C4", "#0E5470"];
  if (has("ሆሣዕና") || has("ሆሳዕና")) return ["#46A35A", "#165026"];
  if (has("ትንሣኤ") || has("ትንሳኤ")) return ["#F0A63A", "#C4551A"];

  return ["#2F62C0", "#0B2452"];
}
function gradient(name) {
  const colors = sectionColors(name);
  return "background:linear-gradient(135deg," + colors[0] + "," + colors[1] + ")";
}
function shortSection(name) { return (name || "").replace(" መዝሙር", ""); }

let toastTimer = 0;
function toast(text) {
  document.querySelectorAll(".toast").forEach(function (old) { old.remove(); });
  const el = h("div", { class: "toast" }, text);
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.remove(); }, 5200);
}

function sheet(build) {
  const shade = h("div", { class: "shade" });
  const close = function () { shade.remove(); };
  shade.addEventListener("click", function (event) { if (event.target === shade) close(); });
  const box = h("div", { class: "sheet" });
  build(box, close);
  shade.appendChild(box);
  document.body.appendChild(shade);
  return close;
}

/** A question with two answers. */
function ask(title, words, yes, danger, onYes) {
  sheet(function (box, close) {
    box.appendChild(h("h2", null, title));
    box.appendChild(h("p", { class: "hint" }, words));
    box.appendChild(h("div", { class: "foot" },
      h("button", { class: "btn", onclick: close }, "Cancel"),
      h("button", { class: "btn " + (danger ? "danger" : "main"), onclick: function () { close(); onYes(); } }, yes)));
  });
}

function route() {
  const hash = decodeURIComponent(location.hash.slice(1));
  const cut = hash.indexOf("=");
  return cut < 0 ? { name: hash || "home", arg: "" } : { name: hash.slice(0, cut), arg: hash.slice(cut + 1) };
}
function go(hash) { if (location.hash.slice(1) === hash) render(); else location.hash = hash; }

function paintStatus() {
  const book = source();
  const changes = countChanges();
  let text = busy;
  if (!text) {
    if (!book) text = "No book loaded yet";
    else text = (online ? "Online • version " : "Saved copy • version ") + (book.rev || 1) + (book.updated ? " • " + book.updated : "");
  }
  $("status").textContent = text;
  const button = $("publish");
  button.textContent = "";
  button.appendChild(icon("send"));
  button.appendChild(document.createTextNode("Publish"));
  if (changes.total) button.appendChild(h("b", null, changes.whole ? "!" : changes.total));
  button.disabled = !changes.total || !!busy;
}

function paintNav(current) {
  for (const id of ["tabs", "deskNav"]) {
    const box = $(id);
    box.textContent = "";
    for (const item of NAV) {
      const on = current === item.route;
      box.appendChild(id === "tabs"
        ? h("button", { class: on ? "on" : "", onclick: function () { leaveForm(function () { go(item.route); }); } }, h("span", null, icon(item.icon)), item.label)
        : h("button", { class: on ? "on" : "", onclick: function () { leaveForm(function () { go(item.route); }); } }, icon(item.icon), item.label));
    }
  }
}

let formDirty = false;
let saveForm = null;      // set while a mezmur is open: saves it (used by Ctrl+S)
/** Asks before leaving a mezmur with typing that was not saved. */
function leaveForm(then) {
  if (!formDirty) return then();
  ask("Leave without saving?", "What you typed in this mezmur is not saved yet.", "Leave", true, function () {
    formDirty = false;
    remember("wip", null);
    then();
  });
}

function render() {
  const where = route();
  const app = $("app");
  app.textContent = "";
  document.querySelectorAll(".actions").forEach(function (old) { old.remove(); });
  formDirty = false;
  saveForm = null;
  const inForm = where.name === "edit" || where.name === "new" || where.name === "copy";
  const back = $("back");
  back.hidden = !inForm && where.name !== "changes";
  back.textContent = "";
  back.appendChild(icon("back"));
  $("logo").hidden = !back.hidden;
  $("tabs").style.display = inForm ? "none" : "";
  $("heading").textContent = "ደብረ ብሥራት";
  paintStatus();
  paintNav(where.name === "changes" ? "home" : inForm ? "list" : where.name);
  window.scrollTo(0, 0);

  if (where.name === "setup" || (!source() && !conn.owner)) return drawSetup(app);
  if (!source()) return drawNoBook(app);
  if (where.name === "edit") return drawForm(app, where.arg, null, null);
  if (where.name === "new") return drawForm(app, null, where.arg === "wereb" ? "wereb" : "mezmur", null);
  if (where.name === "copy") return drawForm(app, null, null, where.arg);
  if (where.name === "list") return drawList(app);
  if (where.name === "history") return drawHistory(app);
  if (where.name === "changes") return drawChanges(app);
  drawHome(app);
}

// ---------- the words of a mezmur ----------
function cleanText(text) {
  return text.replace(/\r\n?/g, "\n").split("\n").map(function (line) { return line.replace(/\s+$/, ""); }).join("\n").replace(/\n{3,}/g, "\n\n").trim();
}

/** Cleans pasted words: extra spaces, odd punctuation, and a verse number in front of a verse. */
function tidyText(text) {
  return text.replace(/\r\n?/g, "\n").replace(/[​-‍﻿]/g, "").split("\n").map(function (line) {
    return line.replace(/[ \t ]+/g, " ").replace(/፡፡|::/g, "።").replace(/\s+([።፣፤])/g, "$1").trim();
  }).join("\n").replace(/\n{3,}/g, "\n\n").replace(/(^|\n\n)\s*(\d{1,2}|[፩-፲])\s*[.)፦\/-]\s*/g, "$1").trim();
}

/** The picture of a mezmur comes from whom it is for. Among the pictures of that name, the least used one. */
function pictureFor(book, name, exceptId) {
  if (!name) return "";
  const uses = {};
  for (const song of book.songs) if (song.w === name && song.img && song.id !== exceptId) uses[song.img] = (uses[song.img] || 0) + 1;
  const options = Object.keys(uses).sort(function (a, b) { return (uses[a] - uses[b]) || a.localeCompare(b); });
  if (options.length) return options[0];
  const entry = (book.names || []).find(function (item) { return item.n === name; });
  return entry ? (entry.img || "") : "";
}

/*
 * The parts of a mezmur. The words are kept as plain text (an empty line between
 * verses, a line "አዝ" where the chorus is sung again) and one number, "ch", that says
 * which verse is the አዝማች. Here they are taken apart so each part can be edited alone.
 *
 *   { type: "verse" | "chorus" | "mark", text }      "mark" = sing the chorus here
 */
const MARK = /^አዝ(ማች)?[\s.…_\-=•፡]*$/;
const REPEAT = /\(\s*(\d+|[፩-፱])\s*(?:ጊዜ)?\s*\)/g;

function toParts(text, chorusAt) {
  const parts = [];
  let lines = [];
  const endVerse = function () {
    if (lines.length) { parts.push({ type: "verse", text: lines.join("\n") }); lines = []; }
  };
  for (const raw of text.replace(/\r\n?/g, "\n").split("\n")) {
    const line = raw.trim();
    if (!line) endVerse();
    else if (MARK.test(line)) { endVerse(); parts.push({ type: "mark", text: "" }); }
    else lines.push(line);
  }
  endVerse();
  // The same rule as in the app: the verse named by "ch"; without it the first verse, when there are "አዝ" marks.
  const verses = parts.filter(function (part) { return part.type === "verse"; });
  const marked = parts.some(function (part) { return part.type === "mark"; });
  const which = verses.length < 2 ? 0 : (chorusAt >= 1 && chorusAt <= verses.length) ? chorusAt : (marked ? 1 : 0);
  if (which) verses[which - 1].type = "chorus";
  return parts;
}

function fromParts(parts) {
  const out = [];
  let verse = 0, chorusAt = 0, marked = false;
  for (const part of parts) {
    if (part.type === "mark") { out.push("አዝ"); marked = true; continue; }
    const text = cleanText(part.text);
    if (!text) continue;
    verse += text.split(/\n\s*\n/).length;
    if (part.type === "chorus") chorusAt = verse;
    out.push(text);
  }
  return { text: out.join("\n\n"), chorusAt: chorusAt, marked: marked };
}

/** One line as the app shows it: "(2)" as a small ×2, and answering words on the right. */
function previewLine(line) {
  const cut = line.indexOf(" || ");
  const main = cut < 0 ? line : line.slice(0, cut);
  const answer = cut < 0 ? "" : line.slice(cut + 4);
  const pieces = [];
  let at = 0;
  main.replace(REPEAT, function (found, count, where) {
    pieces.push(main.slice(at, where).replace(/\s+$/, ""));
    pieces.push(h("span", { class: "times" }, "×" + count));
    at = where + found.length;
    return found;
  });
  pieces.push(main.slice(at));
  return h("div", { class: "pline" }, h("span", null, pieces), answer ? h("span", { class: "answer" }, answer) : null);
}

/** Draws a mezmur the way the app's reading screen shows it. */
function drawPreview(target, data) {
  target.textContent = "";
  const section = data.wereb ? "ወረብ" : data.section;
  const body = h("div", { class: "pbody" }, h("div", { class: "orn" }, "◆ ◆ ◆"));
  let number = 0, any = false;
  const verseCount = data.parts.filter(function (part) { return part.type === "verse" && cleanText(part.text); }).length;
  for (const part of data.parts) {
    if (part.type === "mark") { body.appendChild(h("div", { class: "pmark" }, h("span", null, "↻ አዝማች"))); continue; }
    const text = cleanText(part.text);
    if (!text) continue;
    any = true;
    const lines = text.split("\n").filter(function (line) { return line.trim(); }).map(previewLine);
    if (part.type === "chorus") body.appendChild(h("div", { class: "pchorus" }, h("div", { class: "pname" }, "✢ አዝማች"), lines));
    else {
      number++;
      body.appendChild(h("div", { class: "pverse" }, verseCount > 1 ? h("span", { class: "no" }, number) : null, h("div", { class: "lines" }, lines)));
    }
  }
  if (!any) body.appendChild(h("div", { class: "pempty" }, "The words will show here as you type."));
  if (data.translation) body.appendChild(h("div", { class: "ptrans" }, h("b", null, "ትርጉም"), data.translation));
  target.appendChild(h("div", { class: "scroll" },
    h("div", { class: "phead", style: gradient(section) },
      h("span", { class: "pchip" }, (data.wereb ? "ወረብ" : shortSection(section)) + "  •  " + (data.number || "?")),
      h("h3", null, data.title || "ርዕስ"),
      data.whom ? h("div", { class: "pwhom" }, data.whom) : null),
    body));
}

/** Puts a changed mezmur into my unpublished changes (or takes it out, when it is again as online). */
function stage(next) {
  const book = source();
  const original = book.songs.find(function (song) { return song.id === next.id; }) || null;
  if (original && JSON.stringify(original) === JSON.stringify(next)) {
    delete draft.changed[next.id];
    delete draft.before[next.id];
  } else {
    draft.changed[next.id] = next;
    if (original && !draft.before[next.id]) draft.before[next.id] = original;
  }
}

// ---------- my changes, before they are published ----------
/** The lines that were taken out and put in, in order. */
function diffLines(before, after) {
  const a = before.split("\n"), b = after.split("\n");
  const n = a.length, m = b.length;
  const table = [];
  for (let i = 0; i <= n; i++) table.push(new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) {
    table[i][j] = a[i] === b[j] ? table[i + 1][j + 1] + 1 : Math.max(table[i + 1][j], table[i][j + 1]);
  }
  const out = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) { i++; j++; }
    else if (table[i + 1][j] >= table[i][j + 1]) out.push({ kind: "out", text: a[i++] });
    else out.push({ kind: "in", text: b[j++] });
  }
  while (i < n) out.push({ kind: "out", text: a[i++] });
  while (j < m) out.push({ kind: "in", text: b[j++] });
  return out.filter(function (line) { return line.text.trim(); });
}

function drawChanges(app) {
  const book = source();
  $("heading").textContent = "My changes";
  const changes = countChanges();
  if (!changes.total) {
    app.appendChild(h("div", { class: "card" }, h("div", { class: "empty" }, icon("check"), "Nothing waits to be published.")));

  }
  app.appendChild(h("div", { class: "unsent", style: "margin-top:0" },
    h("div", { class: "what" }, h("b", null, changes.whole ? "The whole book is replaced" : changes.total + " change" + (changes.total > 1 ? "s" : "") + " on this device"),
      h("small", null, "Look them over, then publish them to everyone.")),
    h("button", { class: "btn small", onclick: openPublish }, icon("send"), "Publish")));
  if (changes.whole) app.appendChild(h("div", { class: "warn", style: "margin-top:14px" }, icon("warn"), "You opened a backup file (or an older version). Publishing puts it in place of the whole online book."));

  const names = { t: "Title", n: "Number", c: "Section", tr: "Translation", a: "Recording", w: "For whom", w2: "Also for", ch: "Chorus", s: "Singer", o: "When it is sung" };
  const line = function (kind, text) {
    return h("div", { style: "padding:3px 10px;border-radius:8px;margin-top:3px;font:15px/1.6 var(--serif);" +
      (kind === "in" ? "background:rgba(27,116,102,.14);" : "background:rgba(179,38,30,.12);text-decoration:line-through;opacity:.8;") }, (kind === "in" ? "+ " : "− ") + text);
  };
  const card = function (song, state, body, undo) {

      h("div", { style: "display:flex;gap:12px;align-items:center" },
        h("span", { class: "num", style: gradient(song.k === "wereb" ? "ወረብ" : song.c) }, song.n),

  const known = new Set(book.songs.map(function (song) { return song.id; }));
  for (const id in draft.changed) {

    const body = h("div", { style: "margin-top:10px" });
    if (!was) {
      body.appendChild(h("p", { class: "hint" }, "A new " + (now.k === "wereb" ? "wereb" : "mezmur") + ": " + now.l.split("\n").filter(Boolean).length + " lines."));
    } else {

        body.appendChild(h("div", { class: "hint", style: "margin-top:6px" }, h("b", null, names[key] + ": "), String(was[key] || "—") + "  →  " + String(now[key] || "—")));
      }

    }
    app.appendChild(card(now, was ? "edited" : "new", body, function () {
      delete draft.changed[id]; delete draft.before[id]; keepDraft(); render();
    }));
  }
  for (const id of draft.deleted) {
    const was = book.songs.find(function (song) { return song.id === id; });
    if (!was) continue;
    app.appendChild(card(was, "deleted", h("p", { class: "hint" }, "It will be removed from every phone."), function () {
      draft.deleted = draft.deleted.filter(function (other) { return other !== id; });

  app.appendChild(h("button", { class: "btn danger", style: "margin-top:18px", onclick: function () {

      draft = emptyDraft(); keepDraft(); go("home");

  } }, icon("trash"), "Throw away all my changes"));
}

// ---------- find and replace in the whole book ----------
function openReplace() {
  sheet(function (box, close) {
    const find = h("input", { class: "field", placeholder: "the word as it is written now", autocapitalize: "none" });
    const put = h("input", { class: "field", placeholder: "the word as it should be", autocapitalize: "none" });
    const titles = h("input", { type: "checkbox" });
    const result = h("div", { class: "hint", style: "margin-top:12px;min-height:44px" });
    const doIt = h("button", { class: "btn main", disabled: true }, icon("swap"), "Replace everywhere");
    let found = [];
    const look = function () {
      const word = find.value;
      found = [];
      let places = 0;
      if (word.length >= 2) {
        for (const row of rows()) {
          if (row.state === "deleted") continue;
          const count = row.song.l.split(word).length - 1 + (row.song.tr || "").split(word).length - 1 + (titles.checked ? row.song.t.split(word).length - 1 : 0);
          if (count) { found.push(row.song); places += count; }
        }
      }
      result.textContent = word.length < 2 ? "Write at least two letters." :
        !found.length ? "Not found anywhere." :
        "Found " + places + " time" + (places > 1 ? "s" : "") + " in " + found.length + " mezmur" + (found.length > 1 ? "s" : "") + ": " +
          found.slice(0, 6).map(function (song) { return song.t; }).join("፣ ") + (found.length > 6 ? " …" : "");
      doIt.disabled = !found.length;
    };
    find.addEventListener("input", look);
    titles.addEventListener("change", look);
    doIt.addEventListener("click", function () {
      const word = find.value, next = put.value;
      for (const song of found) {
        const changed = Object.assign({}, song, { l: song.l.split(word).join(next), tr: (song.tr || "").split(word).join(next) });
        if (titles.checked) changed.t = song.t.split(word).join(next);
        stage(changed);
      }
      keepDraft();
      close();
      toast("Replaced in " + found.length + " mezmur" + (found.length > 1 ? "s" : "") + ". Review them, then publish.");
      go("changes");
    });
    box.appendChild(h("h2", null, "Find and replace"));
    box.appendChild(h("p", { class: "hint" }, "Changes a word in the words and translations of every mezmur at once. Nothing is sent until you publish, and you can undo each one."));
    box.appendChild(h("label", { class: "f" }, "Find"));
    box.appendChild(find);
    box.appendChild(h("label", { class: "f" }, "Replace with"));
    box.appendChild(put);
    box.appendChild(h("label", { class: "check", style: "margin-top:10px" }, titles, "Also in titles"));
    box.appendChild(result);
    box.appendChild(h("div", { class: "foot" }, h("button", { class: "btn", onclick: close }, "Cancel"), doIt));
  });
}

// ---------- the versions that were published ----------
async function readHistory() {
  const headers = { "Accept": "application/vnd.github+json" };
  if (conn.token) headers["Authorization"] = "Bearer " + conn.token;
  const address = API + "/repos/" + encodeURIComponent(conn.owner) + "/" + encodeURIComponent(conn.repo) + "/commits?path=" + BOOK_FILE + "&per_page=40";
  let reply;
  try { reply = await fetch(address, { headers: headers, cache: "no-store" }); }
  catch (problem) { throw new Error("No internet connection (or GitHub cannot be reached)."); }
  if (!reply.ok) throw new Error(plainError(reply.status));
  return (await reply.json()).map(function (item) {
    const found = /^Version (\d+)(?::\s*([\s\S]*))?$/.exec(item.commit.message.trim());
    return { sha: item.sha, rev: found ? found[1] : "", note: found ? (found[2] || "") : item.commit.message.trim(),
             when: item.commit.author.date, who: item.commit.author.name };
  });
}

function drawHistory(app) {
  app.appendChild(h("div", { class: "hero blue" },
    h("div", { class: "over" }, "History"),
    h("h1", null, "Published versions"),
    h("div", { class: "note", style: "margin:0" }, "Every time someone publishes, the book gets a new version. An older one can be brought back.")));
  const box = h("div", { style: "margin-top:14px" }, h("div", { class: "card" }, h("div", { class: "empty" }, icon("refresh", "spin"), "Reading the history…")));
  app.appendChild(box);
  if (!conn.owner) { box.textContent = ""; box.appendChild(h("div", { class: "card" }, h("p", { class: "hint", style: "margin:0" }, "Connect first (Connection)."))); return; }
  readHistory().then(function (versions) {
    box.textContent = "";
    if (!versions.length) box.appendChild(h("div", { class: "card" }, h("div", { class: "empty" }, icon("history"), "Nothing was published yet.")));
    versions.forEach(function (version, at) {
      const when = new Date(version.when);
      const day = isNaN(when) ? "" : when.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) + ", " + when.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
      box.appendChild(h("div", { class: "card ver" + (at === 0 ? " now" : "") },
        h("div", { class: "badge" }, version.rev || "•"),
        h("div", { class: "what" },
          h("b", null, version.note || (version.rev ? "Version " + version.rev : "Change")),
          h("small", null, day + (version.who ? " • " + version.who : "")),
          at === 0 ? h("div", { style: "margin-top:6px" }, h("span", { class: "tag new" }, "online now")) :
            h("div", { style: "margin-top:8px" }, h("button", { class: "btn small", onclick: function () {
              ask("Bring back " + (version.rev ? "version " + version.rev : "this version") + "?",
                "The book goes back to how it was then. Nothing changes online until you press Publish, so you can look first.",
                "Bring it back", false, function () { restore(version); });
            } }, icon("undo"), "Bring back")))));
    });
  }).catch(function (problem) {
    box.textContent = "";
    box.appendChild(h("div", { class: "card" }, h("p", { class: "error", style: "margin:0" }, problem.message)));
  });
}

async function restore(version) {
  busy = "Reading the older version…";
  paintStatus();
  try {
    const file = await readFile(BOOK_FILE + "?ref=" + version.sha);
    if (!file) throw new Error("That version could not be read.");
    const book = JSON.parse(file.text);
    draft = emptyDraft();
    draft.whole = book;
    keepDraft();
    busy = "";
    toast((version.rev ? "Version " + version.rev : "That version") + " is open. Look it over, then Publish to put it online.");
    go("changes");
  } catch (problem) {
    busy = "";
    paintStatus();
    toast(problem.message);
  }
}

// ---------- publish, files ----------
function openPublish() {
  const changes = countChanges();
  if (!changes.total) return;
  if (!conn.token) { toast("Add the key first, in Connection."); return; }
  sheet(function (box, close) {
    const note = h("input", { class: "field", placeholder: "for example: 3 new mezmurs for ጥምቀት", maxlength: "120" });
    const lines = [];
    if (changes.whole) lines.push("The whole book is replaced by the file or version you opened.");
    if (changes.added) lines.push(changes.added + " new");
    if (changes.edited) lines.push(changes.edited + " changed");
    if (changes.deleted) lines.push(changes.deleted + " deleted");
    const send = h("button", { class: "btn gold" }, icon("send"), "Publish now");
    const cancel = h("button", { class: "btn", onclick: close }, "Cancel");
    const clashBox = h("div");
    const steps = h("ul", { class: "steps" });
    box.appendChild(h("h2", null, "Publish to everyone"));
    box.appendChild(h("ul", { class: "list" }, lines.map(function (line) { return h("li", null, line); })));
    box.appendChild(h("p", { class: "hint" }, "Every phone with the app gets it by itself, usually within minutes."));
    box.appendChild(h("label", { class: "f" }, "Note ", h("small", null, "people see it in the app under “ምን ተለወጠ?”")));
    box.appendChild(note);
    box.appendChild(clashBox);
    box.appendChild(steps);
    box.appendChild(h("div", { class: "foot" }, cancel, send));

    const step = function (text) {
      if (steps.lastChild) { steps.lastChild.className = "done"; steps.lastChild.firstChild.replaceWith(icon("check")); }
      steps.appendChild(h("li", null, icon("refresh", "spin"), text));
    };
    let checked = false;
    send.addEventListener("click", async function () {
      send.disabled = true; cancel.disabled = true;
      busy = "Publishing…"; paintStatus();
      try {
        if (!checked) {
          step("Checking what is online…");
          const clashes = await findClashes();
          checked = true;
          if (clashes.length) {
            steps.textContent = "";
            clashBox.appendChild(h("div", { class: "warn", style: "margin-top:12px;display:block" },
              "Someone else also changed these after you read the book. If you continue, your version replaces theirs:",
              h("ul", { class: "list" }, clashes.map(function (name) { return h("li", null, name); }))));
            send.textContent = "Publish mine anyway";
            send.disabled = false; cancel.disabled = false;
            busy = ""; paintStatus();
            return;
          }
        }
        const rev = await publish(note.value.trim(), step);
        busy = "";
        close();
        go("home");
        toast("Published. The online book is now version " + rev + ".");
      } catch (problem) {
        busy = "";
        steps.textContent = "";
        steps.appendChild(h("li", { class: "error" }, problem.message));
        send.disabled = false; cancel.disabled = false;
        send.textContent = "Try again";
        paintStatus();
      }
    });
  });
}

function download(name, text) {
  const link = h("a", { href: URL.createObjectURL(new Blob([text], { type: "application/json" })), download: name });
  document.body.appendChild(link);
  link.click();
  setTimeout(function () { URL.revokeObjectURL(link.href); link.remove(); }, 2000);
}

function pickFile() {
  const input = h("input", { type: "file", accept: ".json,application/json" });
  input.addEventListener("change", function () {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () {
      try {
        const book = JSON.parse(reader.result);
        if (!Array.isArray(book.songs) || !Array.isArray(book.categories) || !book.songs.length || !book.songs[0].id) throw new Error("not a book");
        draft = emptyDraft();
        draft.whole = book;
        keepDraft();
        toast("Opened " + book.songs.length + " mezmurs from the file. When you publish, this file replaces the whole online book.");
        go("home");
      } catch (problem) {
        toast("This file is not a mezmur book (mezmurs.json).");
      }
    };
    reader.readAsText(file, "utf-8");
  });
  input.click();
}

$("logo").src = LOGO;
$("publish").addEventListener("click", openPublish);
$("back").addEventListener("click", function () {
  leaveForm(function () { go(route().name === "changes" ? "home" : "list"); });
});
window.addEventListener("hashchange", function () { render(); });
window.addEventListener("beforeunload", function (event) { if (formDirty) { event.preventDefault(); event.returnValue = ""; } });
// Ctrl+S (or ⌘S) saves the open mezmur.
window.addEventListener("keydown", function (event) {
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s" && saveForm) {
    event.preventDefault();
    saveForm();
  }
});

// sw.js keeps a copy of this page in the browser, so it also opens without internet.
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "127.0.0.1" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").catch(function () {});
}

render();
loadOnline(true);
</script>
