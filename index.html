<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ደብረ ብሥራት — Mezmur editor</title>
<style>
  :root {
    --navy: #0F326A; --navy-deep: #081D42; --gold: #F2C25B; --gold-deep: #9A6A10;
    --bg: #F5F8FE; --card: #FFFFFF; --text: #0E1A33; --soft: #4A5670; --line: #D6DEEE;
    --tint: #E7EEFB; --danger: #B3261E; --ok: #1B7466; --warn-bg: #FBEFD2; --warn-text: #3A2A05;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0A1222; --card: #101A2E; --text: #E6ECF8; --soft: #B6C2DA; --line: #2A3856;
      --tint: #1A2744; --danger: #FF8A80; --ok: #7CCFC0; --warn-bg: #3F3212; --warn-text: #FBEFD2;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, "Noto Sans Ethiopic", "Nyala", sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }

  header { position: sticky; top: 0; z-index: 5; background: linear-gradient(120deg, var(--navy-deep), var(--navy)); color: #F7FAFF; padding: 10px 14px 12px; border-radius: 0 0 20px 20px; }
  .bar { display: flex; align-items: center; gap: 10px; max-width: 860px; margin: 0 auto; }
  .bar h1 { font-size: 19px; margin: 0; flex: 1; font-family: Georgia, "Noto Serif Ethiopic", serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status { max-width: 860px; margin: 2px auto 0; font-size: 13px; color: var(--gold); min-height: 18px; }
  .iconbtn { background: rgba(255,255,255,.14); border: 0; color: #F7FAFF; border-radius: 999px; min-width: 42px; height: 42px; padding: 0 12px; font-size: 18px; }
  .publish { background: var(--gold); color: var(--navy-deep); border: 0; border-radius: 999px; height: 42px; padding: 0 18px; font-weight: 700; }
  .publish[disabled] { opacity: .45; cursor: default; }

  main { max-width: 860px; margin: 0 auto; padding: 14px 14px 110px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 6px; font-size: 18px; }
  .hint { color: var(--soft); font-size: 14px; margin: 4px 0 0; }
  .warn { background: var(--warn-bg); color: var(--warn-text); border-radius: 14px; padding: 10px 14px; margin-bottom: 14px; font-size: 14px; }

  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .tabs { display: flex; background: var(--tint); border-radius: 999px; padding: 4px; }
  .tabs button { border: 0; background: transparent; border-radius: 999px; padding: 8px 14px; color: var(--soft); font-weight: 600; }
  .tabs button.on { background: var(--navy); color: #fff; }
  .field, select.field, textarea.field { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; }
  .field:focus { outline: 2px solid var(--gold); border-color: var(--gold); }
  .grow { flex: 1 1 180px; }
  .btn { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 10px 16px; font-weight: 600; }
  .btn.main { background: var(--navy); border-color: var(--navy); color: #fff; }
  .btn.danger { color: var(--danger); }
  .btn.small { padding: 6px 12px; font-size: 14px; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--soft); }
  .check input { width: 20px; height: 20px; }

  .rows { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 11px 14px; }
  .row:last-child { border-bottom: 0; }
  .row:active { background: var(--tint); }
  .num { flex: none; min-width: 44px; height: 34px; border-radius: 999px; background: var(--tint); display: grid; place-items: center; font-weight: 700; font-size: 14px; padding: 0 8px; }
  .row .what { flex: 1; min-width: 0; }
  .row .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .sub { color: var(--soft); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.gone .title { text-decoration: line-through; opacity: .6; }
  .tag { flex: none; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 9px; background: var(--tint); color: var(--soft); }
  .tag.edited { background: var(--gold); color: var(--navy-deep); }
  .tag.new { background: var(--ok); color: #fff; }
  .tag.deleted { background: var(--danger); color: #fff; }
  .empty { padding: 34px 16px; text-align: center; color: var(--soft); }

  label.f { display: block; font-weight: 600; margin: 14px 0 5px; }
  label.f small { font-weight: 400; color: var(--soft); }
  textarea.field { min-height: 120px; resize: vertical; line-height: 1.7; }
  textarea.words { min-height: 340px; font-size: 17px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .two { grid-template-columns: 1fr; } }
  .error { color: var(--danger); font-size: 14px; margin-top: 4px; }
  details { margin-top: 8px; color: var(--soft); font-size: 14px; }
  details code { background: var(--tint); border-radius: 6px; padding: 1px 6px; color: var(--text); }
  .actions { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); z-index: 4; }
  .actions .in { max-width: 860px; margin: 0 auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .actions .btn.main { flex: 1; }

  /* the words, part by part */
  .wordshead { display: flex; align-items: center; gap: 10px; }
  .seg { display: inline-flex; background: var(--tint); border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: transparent; border-radius: 999px; padding: 7px 14px; color: var(--soft); font-weight: 600; font-size: 14px; }
  .seg button.on { background: var(--navy); color: #fff; }
  .part { border: 1px solid var(--line); border-radius: 16px; padding: 10px; margin-top: 10px; background: var(--bg); }
  .part.chorus { border: 2px solid var(--gold); background: var(--warn-bg); }
  .part.mark { border-style: dashed; padding-bottom: 4px; }
  .parthead { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .plabel { font-weight: 700; font-size: 14px; flex: none; min-width: 54px; }
  .part.chorus .plabel { color: var(--gold-deep); }
  .parthead .plabel { flex: 1; }
  .seg.kind { display: flex; margin-bottom: 8px; background: var(--card); border: 1px solid var(--line); }
  .seg.kind button { flex: 1; padding: 8px 6px; font-size: 15px; }
  .part.chorus .seg.kind button.on { background: var(--gold); color: var(--navy-deep); }
  .mini { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 10px; min-width: 36px; height: 36px; padding: 0 8px; font-size: 15px; }
  .mini[disabled] { opacity: .35; }
  .mini.danger { color: var(--danger); }
  .part textarea.field { min-height: 92px; font-size: 17px; overflow: hidden; resize: none; }
  .linetools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 6px; font-size: 13px; color: var(--soft); }

  /* the preview */
  .pverse { border-radius: 14px; padding: 10px 14px; margin-top: 10px; background: var(--bg); font-size: 17px; line-height: 1.8; font-family: Georgia, "Noto Serif Ethiopic", serif; }
  .pverse.chorus { background: var(--warn-bg); border-left: 4px solid var(--gold); }
  .pname { font: 700 12px system-ui, sans-serif; color: var(--gold-deep); margin-bottom: 2px; }
  .pline { display: flex; gap: 12px; justify-content: space-between; }
  .pline .answer { color: var(--gold-deep); text-align: right; flex: none; max-width: 45%; }
  .times { font: 700 12px system-ui, sans-serif; background: var(--tint); border-radius: 999px; padding: 1px 7px; margin-left: 6px; }
  .pmark { display: inline-block; margin-top: 10px; font-weight: 700; font-size: 13px; background: var(--gold); color: var(--navy-deep); border-radius: 999px; padding: 3px 12px; }

  .shade { position: fixed; inset: 0; background: rgba(4,10,24,.55); z-index: 20; display: grid; place-items: end center; }
  @media (min-width: 620px) { .shade { place-items: center; } }
  .sheet { background: var(--card); width: min(560px, 100%); max-height: 88vh; overflow: auto; border-radius: 22px 22px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); }
  @media (min-width: 620px) { .sheet { border-radius: 22px; } }
  .sheet h2 { margin: 0 0 8px; font-size: 19px; }
  .sheet .list { margin: 8px 0; padding-left: 20px; }
  .sheet .foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 16px; }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 13px 6px; border-bottom: 1px solid var(--line); }
  .menu button small { display: block; color: var(--soft); }
  .toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--navy-deep); color: #fff; padding: 11px 18px; border-radius: 999px; z-index: 30; max-width: 92vw; text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
</style>
</head>
<body>
<header>
  <div class="bar">
    <button class="iconbtn" id="back" hidden aria-label="Back">←</button>
    <h1 id="heading">ደብረ ብሥራት — Editor</h1>
    <button class="publish" id="publish" disabled>Publish</button>
    <button class="iconbtn" id="menu" aria-label="Menu">☰</button>
  </div>
  <div class="status" id="status"></div>
</header>
<main id="app"></main>

<script>
"use strict";
/*
 * The editor of the online mezmur book (see ONLINE_GUIDE.md in the project).
 *
 * The book is one file, mezmurs.json, in a private GitHub repository. This page reads
 * it with your key, lets you change mezmurs, and "Publish" writes it back with the
 * version number raised by one. The app on every phone then downloads the new book.
 *
 * This page itself holds no mezmurs and no key, so it is safe on a public web address.
 *
 * Nothing is sent anywhere except to GitHub. Changes that are not published yet are
 * kept in this browser, so you can also work without internet and publish later.
 */
const API = "https://api.github.com";
const BOOK_FILE = "mezmurs.json";
const VERSION_FILE = "version.json";

// ---------- what this browser remembers ----------
const memory = {};
let storageWorks = true;
function recall(key, fallback) {
  try {
    const text = localStorage.getItem("mezmur." + key);
    return text == null ? fallback : JSON.parse(text);
  } catch (problem) {
    storageWorks = false;
    return key in memory ? memory[key] : fallback;
  }
}
function remember(key, value) {
  memory[key] = value;
  try { localStorage.setItem("mezmur." + key, JSON.stringify(value)); } catch (problem) { storageWorks = false; }
}

function emptyDraft() { return { changed: {}, before: {}, deleted: [], whole: null }; }

/**
 * On a github.io page the owner is in the address. The editor page lives in the
 * repository "mezmur-editor" and the book in "mezmur": the name without "-editor".
 */
function guessConnection() {
  const host = location.hostname;
  if (!host.endsWith(".github.io")) return { owner: "", repo: "mezmur", token: "" };
  const owner = host.split(".")[0];
  const folder = location.pathname.split("/").filter(Boolean)[0] || "";
  const repo = !folder || folder.endsWith(".html") ? "mezmur" : folder.replace(/-editor$/, "");
  return { owner: owner, repo: repo, token: "" };
}

let conn = recall("conn", null) || guessConnection();
let base = recall("base", null);          // the book as it is online (the last time it was read)
let draft = recall("draft", null) || emptyDraft();   // my changes that are not published yet
let online = false;                       // true when "base" was read from GitHub in this visit
let busy = "";                            // a short text while something is loading
let listState = { kind: "mezmur", section: "", query: "", mine: false, scroll: 0 };

function keepDraft() { remember("draft", draft); view = null; }

// ---------- the book with my changes on top ----------
function source() { return draft.whole || base; }

function sectionIndex(book, name) {
  const at = (book.categories || []).indexOf(name);
  return at < 0 ? 999 : at;
}

/** Mezmurs in the order of the sections and then by number; wereb after them. */
function sorted(book, songs) {
  return songs.map(function (song, at) { return { song: song, at: at }; }).sort(function (a, b) {
    const wa = a.song.k === "wereb" ? 1 : 0, wb = b.song.k === "wereb" ? 1 : 0;
    if (wa !== wb) return wa - wb;
    if (!wa) {
      const sa = sectionIndex(book, a.song.c), sb = sectionIndex(book, b.song.c);
      if (sa !== sb) return sa - sb;
    }
    return (a.song.n - b.song.n) || (a.at - b.at);
  }).map(function (item) { return item.song; });
}

/** Puts the changes of a draft into a book (used for showing and for publishing). */
function applyDraft(book, changes) {
  const gone = new Set(changes.deleted);
  const known = new Set(book.songs.map(function (song) { return song.id; }));
  let songs = book.songs.filter(function (song) { return !gone.has(song.id); })
    .map(function (song) { return changes.changed[song.id] || song; });
  for (const id in changes.changed) if (!known.has(id)) songs.push(changes.changed[id]);
  book.songs = sorted(book, songs);
  return book;
}

/** Every row of the list: the song as I have it now, and what I did to it. */
let view = null;
function rows() {
  if (view) return view;
  const book = source();
  if (!book) return [];
  const gone = new Set(draft.deleted);
  const known = new Set();
  const list = [];
  for (const song of book.songs) {
    known.add(song.id);
    if (gone.has(song.id)) list.push({ song: song, state: "deleted" });
    else if (draft.changed[song.id]) list.push({ song: draft.changed[song.id], state: "edited" });
    else list.push({ song: song, state: "" });
  }
  for (const id in draft.changed) if (!known.has(id)) list.push({ song: draft.changed[id], state: "new" });
  const order = new Map(sorted(book, list.map(function (row) { return row.song; })).map(function (song, at) { return [song.id, at]; }));
  view = list.sort(function (a, b) { return order.get(a.song.id) - order.get(b.song.id); });
  return view;
}

function countChanges() {
  let edited = 0, added = 0;
  const book = source();
  const known = new Set(book ? book.songs.map(function (song) { return song.id; }) : []);
  for (const id in draft.changed) if (known.has(id)) edited++; else added++;
  return { edited: edited, added: added, deleted: draft.deleted.length, whole: !!draft.whole,
           total: edited + added + draft.deleted.length + (draft.whole ? 1 : 0) };
}

// ---------- GitHub ----------
function toBase64(text) {
  const bytes = new TextEncoder().encode(text);
  let binary = "";
  for (let i = 0; i < bytes.length; i += 0x8000) binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(binary);
}
function fromBase64(encoded) {
  const binary = atob(encoded.replace(/\s/g, ""));
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}

function plainError(status) {
  if (status === 401) return "The key is wrong or has expired. Open the menu → Connection and paste a new key.";
  if (status === 403) return "GitHub refused. The key may not have permission for this repository (it needs Contents: Read and write), or there were too many tries. Wait a few minutes.";
  if (status === 404) return conn.token
    ? "Not found. Check the user name and the repository name in the menu → Connection. If they are right, the key is not allowed to open this repository."
    : "The book is private: it can only be read with the key. Add the key in the menu → Connection.";
  return "GitHub answered with an error (" + status + "). Try again in a minute.";
}

async function github(path, options) {
  options = options || {};
  const headers = Object.assign({ "Accept": "application/vnd.github+json" }, options.headers || {});
  if (conn.token) headers["Authorization"] = "Bearer " + conn.token;
  const address = API + "/repos/" + encodeURIComponent(conn.owner) + "/" + encodeURIComponent(conn.repo) + "/contents/" + path;
  let reply;
  try {
    reply = await fetch(address, { method: options.method || "GET", headers: headers, body: options.body, cache: "no-store" });
  } catch (problem) {
    const failed = new Error("No internet connection (or GitHub cannot be reached).");
    failed.offline = true;
    throw failed;
  }
  return reply;
}

/** The text of a file and its "sha" (GitHub needs the sha to replace the file). Null when there is no such file. */
async function readFile(path) {
  const reply = await github(path);
  if (reply.status === 404) return null;
  if (!reply.ok) throw new Error(plainError(reply.status));
  const info = await reply.json();
  let text;
  if (info.content) {
    text = fromBase64(info.content);
  } else {   // a file over 1 MB comes without its content: ask for it raw
    const raw = await github(path, { headers: { "Accept": "application/vnd.github.raw+json" } });
    if (!raw.ok) throw new Error(plainError(raw.status));
    text = await raw.text();
  }
  return { text: text, sha: info.sha };
}

async function writeFile(path, text, sha, message) {
  const body = { message: message, content: toBase64(text) };
  if (sha) body.sha = sha;
  const reply = await github(path, { method: "PUT", body: JSON.stringify(body) });
  if (reply.status === 409 || reply.status === 422) {
    const clash = new Error("Someone else published at the same moment.");
    clash.clash = true;
    throw clash;
  }
  if (!reply.ok) throw new Error(plainError(reply.status));
}

function versionText(book) {
  return JSON.stringify({ rev: book.rev || 1, updated: book.updated || "", songs: book.songs.length, note: book.note || "" });
}

/** The small file the app reads first. Written again whenever it does not match the book. */
async function matchVersionFile(book) {
  const now = await readFile(VERSION_FILE);
  const wanted = versionText(book);
  if (now && now.text === wanted) return;
  await writeFile(VERSION_FILE, wanted, now ? now.sha : null, "Version " + (book.rev || 1));
}

async function loadOnline(quiet) {
  if (!conn.owner || !conn.repo) return;
  busy = "Reading the book from GitHub…";
  paintStatus();
  try {
    const file = await readFile(BOOK_FILE);
    if (!file) {
      busy = "";
      online = false;
      if (!quiet || !base) toast(conn.token ? "The book (mezmurs.json) was not found. Check the names in menu → Connection, or open a backup file and publish it." : plainError(404));
    } else {
      base = JSON.parse(file.text);
      remember("base", base);
      online = true;
      view = null;
      busy = "";
      if (conn.token) matchVersionFile(base).catch(function () {});
    }
  } catch (problem) {
    busy = "";
    online = false;
    if (!quiet || !base) toast(problem.message);
  }
  render();
}

/** The date on this device, like 2026-11-15. */
function today() {
  const now = new Date();
  return now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
}

/**
 * Publishing: read the newest book again, put my changes on top of it, raise the
 * version by one, and write it. So changes that another person published while I
 * was working are kept; only the mezmurs I touched are replaced.
 */
async function publish(note, onStep) {
  for (let attempt = 1; attempt <= 3; attempt++) {
    onStep("Reading the newest book…");
    const file = await readFile(BOOK_FILE);
    const newest = file ? JSON.parse(file.text) : null;
    const book = draft.whole ? JSON.parse(JSON.stringify(draft.whole)) : newest;
    if (!book) throw new Error("There is no book online yet. Menu → Open a backup file first.");
    applyDraft(book, draft);
    book.rev = Math.max(newest ? (newest.rev || 0) : 0, book.rev || 0) + 1;
    book.updated = today();
    book.note = note || "";
    onStep("Sending version " + book.rev + "…");
    try {
      await writeFile(BOOK_FILE, JSON.stringify(book), file ? file.sha : null, "Version " + book.rev + (note ? ": " + note : ""));
    } catch (problem) {
      if (problem.clash && attempt < 3) continue;   // someone else was faster: start again from their book
      throw problem;
    }
    base = book;
    remember("base", base);
    draft = emptyDraft();
    keepDraft();
    online = true;
    onStep("Almost done…");
    let last = null;
    for (let i = 0; i < 3; i++) {
      try { await matchVersionFile(book); last = null; break; } catch (problem) { last = problem; }
    }
    if (last) throw new Error("The book was sent, but the small version file was not. Open the menu → Read again from online; it will be repaired.");
    return book.rev;
  }
}

/** Mezmurs I changed that someone else also changed online after I read the book. */
async function findClashes() {
  if (draft.whole) return [];
  const file = await readFile(BOOK_FILE);
  if (!file) return [];
  const newest = JSON.parse(file.text);
  const byId = new Map(newest.songs.map(function (song) { return [song.id, song]; }));
  const clashes = [];
  const mine = Object.keys(draft.changed).concat(draft.deleted);
  for (const id of mine) {
    const was = draft.before[id];
    const now = byId.get(id);
    if (was && now && JSON.stringify(was) !== JSON.stringify(now)) clashes.push(now.t + " (" + now.n + ")");
    if (was && !now) clashes.push(was.t + " (" + was.n + ") — deleted online");
  }
  return clashes;
}

// ---------- drawing ----------
function h(tag, props) {
  const el = document.createElement(tag);
  let value;
  for (const key in (props || {})) {
    const v = props[key];
    if (v == null || v === false) continue;
    if (key === "class") el.className = v;
    else if (key === "value") value = v;
    else if (key.slice(0, 2) === "on") el.addEventListener(key.slice(2), v);
    else if (key === "checked" || key === "disabled" || key === "hidden") el[key] = true;
    else el.setAttribute(key, v);
  }
  for (let i = 2; i < arguments.length; i++) {
    const kids = Array.isArray(arguments[i]) ? arguments[i] : [arguments[i]];
    for (const kid of kids) {
      if (kid == null || kid === false) continue;
      el.appendChild(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
  }
  if (value !== undefined) el.value = value;
  return el;
}
const $ = function (id) { return document.getElementById(id); };

let toastTimer = 0;
function toast(text) {
  document.querySelectorAll(".toast").forEach(function (old) { old.remove(); });
  const el = h("div", { class: "toast" }, text);
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.remove(); }, 5200);

function sheet(build) {
  const shade = h("div", { class: "shade" });

  shade.addEventListener("click", function (event) { if (event.target === shade) close(); });
  const box = h("div", { class: "sheet" });
  build(box, close);
  shade.appendChild(box);
  document.body.appendChild(shade);
  return close;
}

  const book = source();
  const changes = countChanges();
  let text = busy;
  if (!text) {
    if (!book) text = "No book loaded yet";
    else {
      text = (online ? "Online version " : "Saved copy, version ") + (book.rev || 1) + (book.updated ? " • " + book.updated : "");
      if (changes.total) text += " • " + (changes.whole ? "whole book replaced" : changes.total + " change" + (changes.total > 1 ? "s" : "") + " not published");

function route() {

  const cut = hash.indexOf("=");
  return cut < 0 ? { name: hash, arg: "" } : { name: hash.slice(0, cut), arg: hash.slice(cut + 1) };
}
function go(hash) { if (location.hash.slice(1) === hash) render(); else location.hash = hash; }

let formDirty = false;
function render() {
  const where = route();
  const app = $("app");
  app.textContent = "";
  document.querySelectorAll(".actions").forEach(function (old) { old.remove(); });
  formDirty = false;
  const inner = where.name === "edit" || where.name === "new" || where.name === "setup";
  $("back").hidden = !inner || (where.name === "setup" && !source());
  $("heading").textContent = where.name === "setup" ? "Connection" : where.name === "new" ? "New" : where.name === "edit" ? "Edit" : "ደብረ ብሥራት — Editor";

  if (where.name === "new") return drawForm(app, null, where.arg === "wereb" ? "wereb" : "mezmur");
  drawList(app);
}

// ---------- the form ----------
function cleanText(text) {
  return text.replace(/\r\n?/g, "\n").split("\n").map(function (line) { return line.replace(/\s+$/, ""); }).join("\n").replace(/\n{3,}/g, "\n\n").trim();
}

/** The picture of a mezmur comes from whom it is for. Among the pictures of that name, the least used one. */
function pictureFor(book, name, exceptId) {
  if (!name) return "";
  const uses = {};
  for (const song of book.songs) if (song.w === name && song.img && song.id !== exceptId) uses[song.img] = (uses[song.img] || 0) + 1;
  const options = Object.keys(uses).sort(function (a, b) { return (uses[a] - uses[b]) || a.localeCompare(b); });
  if (options.length) return options[0];
  const entry = (book.names || []).find(function (item) { return item.n === name; });
  return entry ? (entry.img || "") : "";
}

/*
 * The parts of a mezmur. The words are kept as plain text (an empty line between
 * verses, a line "አዝ" where the chorus is sung again) and one number, "ch", that says
 * which verse is the አዝማች. Here they are taken apart so each part can be edited alone.
 *
 *   { type: "verse" | "chorus" | "mark", text }      "mark" = sing the chorus here
 */
const MARK = /^አዝ(ማች)?[\s.…_\-=•፡]*$/;
const REPEAT = /\(\s*(\d+|[፩-፱])\s*(?:ጊዜ)?\s*\)/g;

function toParts(text, chorusAt) {
  const parts = [];
  let lines = [];
  const endVerse = function () {
    if (lines.length) { parts.push({ type: "verse", text: lines.join("\n") }); lines = []; }
  };
  for (const raw of text.replace(/\r\n?/g, "\n").split("\n")) {
    const line = raw.trim();
    if (!line) endVerse();
    else if (MARK.test(line)) { endVerse(); parts.push({ type: "mark", text: "" }); }
    else lines.push(line);
  }
  endVerse();
  // The same rule as in the app: the verse named by "ch"; without it the first verse, when there are "አዝ" marks.
  const verses = parts.filter(function (part) { return part.type === "verse"; });
  const marked = parts.some(function (part) { return part.type === "mark"; });
  const which = verses.length < 2 ? 0 : (chorusAt >= 1 && chorusAt <= verses.length) ? chorusAt : (marked ? 1 : 0);
  if (which) verses[which - 1].type = "chorus";
  return parts;
}

function fromParts(parts) {
  const out = [];
  let verse = 0, chorusAt = 0, marked = false;
  for (const part of parts) {
    if (part.type === "mark") { out.push("አዝ"); marked = true; continue; }
    const text = cleanText(part.text);
    if (!text) continue;
    verse += text.split(/\n\s*\n/).length;
    if (part.type === "chorus") chorusAt = verse;
    out.push(text);
  }
  return { text: out.join("\n\n"), chorusAt: chorusAt, marked: marked };
}

/** One line as the app shows it: "(2)" as a small ×2, and answering words on the right. */
function previewLine(line) {
  const cut = line.indexOf(" || ");
  const main = cut < 0 ? line : line.slice(0, cut);
  const answer = cut < 0 ? "" : line.slice(cut + 4);
  const pieces = [];
  let at = 0;
  main.replace(REPEAT, function (found, count, where) {
    pieces.push(main.slice(at, where).replace(/\s+$/, ""));
    pieces.push(h("span", { class: "times" }, "×" + count));
    at = where + found.length;
    return found;
  });
  pieces.push(main.slice(at));
  return h("div", { class: "pline" }, h("span", null, pieces), answer ? h("span", { class: "answer" }, answer) : null);
}

function openPreview(title, parts, translation) {
  sheet(function (box, close) {
    box.appendChild(h("h2", null, title || "Preview"));
    box.appendChild(h("p", { class: "hint" }, "This is how the parts will be shown in the app."));
    let number = 0;
    for (const part of parts) {
      if (part.type === "mark") { box.appendChild(h("div", { class: "pmark" }, "አዝ…")); continue; }
      const text = cleanText(part.text);
      if (!text) continue;
      const chorus = part.type === "chorus";
      box.appendChild(h("div", { class: "pverse" + (chorus ? " chorus" : "") },
        h("div", { class: "pname" }, chorus ? "አዝማች" : String(++number)),
        text.split("\n").filter(function (line) { return line.trim(); }).map(previewLine)));
    }
    if (translation) box.appendChild(h("div", { class: "pverse" }, h("div", { class: "pname" }, "ትርጉም"), h("div", null, translation)));
    box.appendChild(h("div", { class: "foot" }, h("button", { class: "btn main", onclick: close }, "Close")));
  });
}

function drawForm(app, id, newKind) {
  const book = source();
  const original = id ? book.songs.find(function (song) { return song.id === id; }) : null;   // as it is online
  const mineNow = id ? (draft.changed[id] || original) : null;
  if (id && !mineNow) { go(""); return; }
  const isNew = !id;
  const song = mineNow ? Object.assign({}, mineNow) : {
    id: "", n: 0, t: "", c: newKind === "wereb" ? "ወረብ" : (listState.section || (book.categories || [])[0] || ""),
    s: "", l: "", tr: "", k: newKind, o: "", a: "", w: "", w2: "", ch: 0, img: "",
  };
  const wereb = song.k === "wereb";
  if (isNew) {
    const same = rows().filter(function (row) { return (row.song.k === "wereb") === wereb; });
    song.n = same.reduce(function (most, row) { return Math.max(most, row.song.n); }, 0) + 1;
  }
  $("heading").textContent = isNew ? (wereb ? "New wereb" : "New mezmur") : song.t;

  const dirty = function () { formDirty = true; };
  const field = function (props) { return h("input", Object.assign({ class: "field", oninput: dirty }, props)); };
  const names = (book.names || []).map(function (item) { return item.n; });
  const nameSelect = function (value) {
    const select = h("select", { class: "field", onchange: dirty },
      h("option", { value: "" }, "— none —"),
      names.map(function (name) { return h("option", { value: name }, name); }),
      value && names.indexOf(value) < 0 ? h("option", { value: value }, value) : null);
    select.value = value || "";
    return select;
  };

  const title = field({ value: song.t });
  const number = field({ value: song.n, type: "number", min: "1", inputmode: "numeric" });
  const section = h("select", { class: "field", onchange: dirty }, (book.categories || []).map(function (name) { return h("option", { value: name }, name); }));
  section.value = song.c;
  const translation = h("textarea", { class: "field", oninput: dirty, spellcheck: "false" });
  translation.value = song.tr || "";
  const sound = field({ value: song.a || "", type: "url", inputmode: "url", autocapitalize: "none", placeholder: "https://…  (leave empty when there is no recording)" });
  const whom = nameSelect(song.w);
  const also = nameSelect(song.w2);
  const occasion = field({ value: song.o || "" });
  const singer = field({ value: song.s || "" });
  const errors = h("div", { class: "error" });

  // ----- the words, part by part -----
  let parts = toParts(song.l, song.ch || 0);
  if (!parts.length) parts = [{ type: "verse", text: "" }];
  let mode = "parts";
  let chorusKept = song.ch || 0;      // which verse is the chorus, while the words are shown as plain text
  const partsBox = h("div");
  const plain = h("textarea", { class: "field words", spellcheck: "false", oninput: dirty });
  const wordsBox = h("div");

  const grow = function (area) { area.style.height = "auto"; area.style.height = (area.scrollHeight + 4) + "px"; };

  /** Changes the line the cursor is on (for the ×2 and the answer buttons). */
  const onLine = function (area, change) {
    const text = area.value;
    const at = area.selectionStart;
    const start = text.lastIndexOf("\n", at - 1) + 1;
    let end = text.indexOf("\n", at);
    if (end < 0) end = text.length;
    const next = change(text.slice(start, end));
    area.value = text.slice(0, start) + next + text.slice(end);
    area.dispatchEvent(new Event("input"));
    area.focus();
    area.setSelectionRange(start + next.length, start + next.length);
  };
  const keepFocus = function (event) { event.preventDefault(); };

  const paintParts = function () {
    partsBox.textContent = "";
    let verse = 0;
    const areas = [];
    parts.forEach(function (part, at) {
      const label = part.type === "chorus" ? "አዝማች" : part.type === "mark" ? "አዝ" : "ግጥም " + (++verse);
      // What this part is: one tap on one of three buttons.
      const choice = function (type, text, explain) {
        return h("button", { class: part.type === type ? "on" : "", title: explain, onclick: function () {
          if (part.type === type) return;
          if (type === "chorus") parts.forEach(function (other) { if (other.type === "chorus") other.type = "verse"; });   // only one chorus
          part.type = type;
          dirty(); paintParts();
        } }, text);
      };
      const kind = h("div", { class: "seg kind" },
        choice("verse", "ግጥም", "A verse"),
        choice("chorus", "አዝማች", "The chorus"),
        choice("mark", "አዝ", "Sing the chorus again here"));

      const move = function (by) {
        const to = at + by;
        if (to < 0 || to >= parts.length) return;
        parts.splice(to, 0, parts.splice(at, 1)[0]);
        dirty(); paintParts();
      };
      const head = h("div", { class: "parthead" },
        h("span", { class: "plabel" }, label),
        h("button", { class: "mini", title: "Move up", "aria-label": "Move up", disabled: at === 0, onclick: function () { move(-1); } }, "↑"),
        h("button", { class: "mini", title: "Move down", "aria-label": "Move down", disabled: at === parts.length - 1, onclick: function () { move(1); } }, "↓"),
        h("button", { class: "mini", title: "Add a verse below", "aria-label": "Add a verse below", onclick: function () {
          parts.splice(at + 1, 0, { type: "verse", text: "" }); dirty(); paintParts();
        } }, "+"),
        h("button", { class: "mini danger", title: "Remove this part", "aria-label": "Remove this part", onclick: function () {
          if (part.type !== "mark" && part.text.trim() && !confirm("Remove this part and its words?")) return;
          parts.splice(at, 1);
          if (!parts.length) parts.push({ type: "verse", text: "" });
          dirty(); paintParts();
        } }, "✕"));

      let body;
      if (part.type === "mark") {
        body = h("p", { class: "hint" }, "The chorus is sung again here.");
      } else {
        const area = h("textarea", { class: "field", spellcheck: "false", placeholder: at === 0 ? "Write or paste the words here. An empty line starts a new part." : "" });
        area.value = part.text;
        area.addEventListener("input", function () { part.text = area.value; dirty(); grow(area); });
        // Pasted a whole mezmur into one box: when leaving the box, cut it into parts at the empty lines.
        area.addEventListener("change", function () {
          if (!/\n\s*\n/.test(area.value.trim())) return;
          const pieces = toParts(area.value, 0);
          if (part.type === "chorus" && pieces.length) pieces[0].type = "chorus";
          else pieces.forEach(function (piece) { if (piece.type === "chorus") piece.type = "verse"; });
          parts.splice.apply(parts, [at, 1].concat(pieces));
          paintParts();
        });
        const times = function (count) {
          return h("button", { class: "mini", onpointerdown: keepFocus, onclick: function () {
            onLine(area, function (line) {
              const bare = line.replace(/\s*\(\s*(\d+|[፩-፱])\s*(?:ጊዜ)?\s*\)\s*$/, "");
              return count > 1 ? bare + " (" + count + ")" : bare;
            });
          } }, count > 1 ? "×" + count : "×1");
        };
        body = h("div", null, area,
          h("div", { class: "linetools" }, "This line is sung:", times(1), times(2), times(3), times(4),
            h("button", { class: "mini", onpointerdown: keepFocus, title: "Answering words, shown on the right", onclick: function () {
              onLine(area, function (line) { return line.indexOf(" || ") >= 0 ? line : line.replace(/\s+$/, "") + " || "; });
            } }, "+ answer")));
        areas.push(area);
      }
      partsBox.appendChild(h("div", { class: "part " + part.type }, head, kind, body));
    });
    requestAnimationFrame(function () { areas.forEach(grow); });
  };

  const paintWords = function () {
    wordsBox.textContent = "";
    const tab = function (name, label) {
      return h("button", { class: mode === name ? "on" : "", onclick: function () {
        if (mode === name) return;
        if (name === "plain") {
          const now = fromParts(parts);
          chorusKept = now.chorusAt;
          plain.value = now.text;
        } else {
          parts = toParts(plain.value, chorusKept);
          if (!parts.length) parts = [{ type: "verse", text: "" }];
        }
        mode = name;
        paintWords();
      } }, label);
    };
    wordsBox.appendChild(h("div", { class: "wordshead" },
      h("label", { class: "f", style: "margin:0;flex:1" }, "Words ", h("small", null, "ግጥም")),
      h("div", { class: "seg" }, tab("parts", "Parts"), tab("plain", "Plain text"))));
    if (mode === "plain") {
      wordsBox.appendChild(h("p", { class: "hint" }, "The whole mezmur as one text: an empty line between verses, a line with only አዝ where the chorus is sung again. To choose which verse is the chorus, go back to Parts."));
      wordsBox.appendChild(plain);
      return;
    }
    wordsBox.appendChild(h("p", { class: "hint" }, "Each box is one part. Tap what it is: ግጥም (a verse), አዝማች (the chorus), or አዝ (the place where the chorus is sung again)."));
    paintParts();
    wordsBox.appendChild(partsBox);
    wordsBox.appendChild(h("div", { class: "tools", style: "margin-top:12px" },
      h("button", { class: "btn small", onclick: function () { parts.push({ type: "verse", text: "" }); dirty(); paintParts(); } }, "+ Verse"),
      h("button", { class: "btn small", onclick: function () { parts.push({ type: "mark", text: "" }); dirty(); paintParts(); } }, "+ አዝ here"),
      h("button", { class: "btn small", title: "Puts አዝ after every verse", onclick: function () {
        let kept = parts.filter(function (part) { return part.type !== "mark"; });
        if (!kept.some(function (part) { return part.type === "chorus"; }) && kept.length) kept[0].type = "chorus";
        parts = [];
        kept.forEach(function (part) {
          parts.push(part);
          if (part.type === "verse" && part.text.trim()) parts.push({ type: "mark", text: "" });
        });
        dirty(); paintParts();
      } }, "አዝ after every verse")));
  };
  paintWords();

  const currentParts = function () {
    if (mode === "plain") return toParts(plain.value, chorusKept);
    return parts;
  };

  app.appendChild(h("div", { class: "card" },
    h("label", { class: "f", style: "margin-top:0" }, "Title ", h("small", null, "ርዕስ")), title,
    h("div", { class: "two" },
      h("div", null, h("label", { class: "f" }, "Number ", h("small", null, "ቁጥር")), number),
      wereb ? h("div", null, h("label", { class: "f" }, "When it is sung ", h("small", null, "በዓል / ዕለት")), occasion)
            : h("div", null, h("label", { class: "f" }, "Section ", h("small", null, "ክፍል")), section))));

  app.appendChild(h("div", { class: "card" }, wordsBox));

  app.appendChild(h("div", { class: "card" },
    h("label", { class: "f", style: "margin-top:0" }, "Translation ", h("small", null, "ትርጉም — may be empty")), translation,
    h("div", { class: "two" },
      h("div", null, h("label", { class: "f" }, "For whom ", h("small", null, "this chooses the picture")), whom),
      h("div", null, h("label", { class: "f" }, "Also for ", h("small", null, "a second name, if any")), also)),
    h("label", { class: "f" }, "Recording link ", h("small", null, "ድምፅ")), sound,
    h("p", { class: "hint" }, "A direct link to the sound file. For Dropbox the link must end with dl=1 (it is corrected for you)."),
    h("label", { class: "f" }, wereb ? "Composer " : "Singer or composer ", h("small", null, wereb ? "for example ቅዱስ ያሬድ" : "may be empty")), singer,
    isNew ? null : h("p", { class: "hint" }, "Code of this mezmur: " + song.id + " (it never changes; favorites on phones use it)"),
    errors));

  const save = function () {
    const words = fromParts(currentParts());
    // "ch" is left as it was when the first verse is the chorus only because of the "አዝ" marks
    // (as in the book), and when there is only one verse (then the app shows no chorus anyway).
    const verseCount = words.text ? words.text.split(/\n\s*\n/).filter(function (piece) { return !MARK.test(piece.trim()); }).length : 0;
    const chorus = verseCount < 2 ? (song.ch || 0)
      : (words.chorusAt === 1 && words.marked && !(song.ch > 0)) ? 0 : words.chorusAt;
    const next = Object.assign({}, song, {
      t: title.value.trim().replace(/\s+/g, " "),
      n: parseInt(number.value, 10) || 0,
      c: wereb ? "ወረብ" : section.value,
      l: words.text,
      tr: cleanText(translation.value),
      a: sound.value.trim(),
      w: whom.value, w2: also.value === whom.value ? "" : also.value,
      ch: chorus,
      o: wereb ? occasion.value.trim() : "",
      s: singer.value.trim(),
    });
    if (/dropbox\.com/.test(next.a)) next.a = next.a.replace(/([?&])dl=0\b/, "$1dl=1");
    const problems = [];
    if (!next.t) problems.push("Write the title.");
    if (next.l.length < 10) problems.push("Write the words.");
    if (next.n < 1) problems.push("The number must be 1 or more.");
    if (next.a && !/^https?:\/\//.test(next.a)) problems.push("The recording link must start with https://");
    if (problems.length) { errors.textContent = problems.join(" "); errors.scrollIntoView({ block: "center" }); return; }

    if (isNew) next.id = "web" + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36);
    if (isNew || next.w !== (mineNow ? mineNow.w : "")) next.img = pictureFor(applyDraft(Object.assign({}, book, { songs: book.songs.slice() }), draft), next.w, next.id);

    const twin = rows().find(function (row) {
      return row.song.id !== next.id && row.state !== "deleted" && (row.song.k === "wereb") === wereb && row.song.n === next.n;
    });

    if (original && JSON.stringify(original) === JSON.stringify(next)) {
      delete draft.changed[next.id];      // back to what is online: not a change any more
      delete draft.before[next.id];
    } else {
      draft.changed[next.id] = next;
      if (original && !draft.before[next.id]) draft.before[next.id] = original;
    }
    keepDraft();
    formDirty = false;
    toast(twin ? "Saved. Note: number " + next.n + " is also used by “" + twin.song.t + "”." : "Saved on this device. Press Publish to send it to everyone.");
    go("");
  };

  const buttons = [
    h("button", { class: "btn main", onclick: save }, isNew ? "Add" : "Save"),
    h("button", { class: "btn", onclick: function () { openPreview(title.value.trim(), currentParts(), cleanText(translation.value)); } }, "Preview"),
  ];
  if (!isNew && original && draft.changed[id]) buttons.push(h("button", { class: "btn", onclick: function () {
    delete draft.changed[id]; delete draft.before[id]; keepDraft(); toast("Your changes to this one were removed."); go("");
  } }, "Undo my changes"));
  if (!isNew) buttons.push(h("button", { class: "btn danger", onclick: function () {
    sheet(function (box, close) {
      box.appendChild(h("h2", null, "Delete “" + song.t + "”?"));
      box.appendChild(h("p", { class: "hint" }, "It disappears from every phone after you publish. Until then you can bring it back from the list."));
      box.appendChild(h("div", { class: "foot" },
        h("button", { class: "btn", onclick: close }, "Cancel"),
        h("button", { class: "btn danger", onclick: function () {
          delete draft.changed[id];
          if (original) {
            if (draft.deleted.indexOf(id) < 0) draft.deleted.push(id);
            if (!draft.before[id]) draft.before[id] = original;
          }
          keepDraft(); close(); formDirty = false; go("");
        } }, "Delete")));
    });
  } }, "Delete"));
  document.body.appendChild(h("div", { class: "actions" }, h("div", { class: "in" }, buttons)));
}

// ---------- publish, menu, files ----------
function openPublish() {
  const changes = countChanges();
  if (!changes.total) return;
  if (!conn.token) { toast("Add the key first: menu → Connection."); return; }
  sheet(function (box, close) {
    const note = h("input", { class: "field", placeholder: "for example: 3 new mezmurs for ጥምቀት", maxlength: "120" });
    const progress = h("p", { class: "hint" });
    const lines = [];
    if (changes.whole) lines.push("The whole book is replaced by the file you opened.");
    if (changes.added) lines.push(changes.added + " new");
    if (changes.edited) lines.push(changes.edited + " changed");
    if (changes.deleted) lines.push(changes.deleted + " deleted");
    const send = h("button", { class: "btn main" }, "Publish now");
    const cancel = h("button", { class: "btn", onclick: close }, "Cancel");
    const clashBox = h("div");
    box.appendChild(h("h2", null, "Publish to everyone"));
    box.appendChild(h("ul", { class: "list" }, lines.map(function (line) { return h("li", null, line); })));
    box.appendChild(h("p", { class: "hint" }, "Every phone with the app gets this within about a day (or at once with “check now” in the app's settings)."));
    box.appendChild(h("label", { class: "f" }, "Note ", h("small", null, "what changed — optional")));
    box.appendChild(note);
    box.appendChild(clashBox);
    box.appendChild(progress);
    box.appendChild(h("div", { class: "foot" }, cancel, send));

    let checked = false;
    send.addEventListener("click", async function () {
      send.disabled = true; cancel.disabled = true;
      busy = "Publishing…"; paintStatus();
      try {
        if (!checked) {
          progress.textContent = "Checking what is online…";
          const clashes = await findClashes();
          checked = true;
          if (clashes.length) {
            clashBox.appendChild(h("div", { class: "warn", style: "margin-top:12px" },
              "Someone else also changed these after you read the book. If you continue, your version replaces theirs:",
              h("ul", { class: "list" }, clashes.map(function (name) { return h("li", null, name); }))));
            send.textContent = "Publish mine anyway";
            progress.textContent = "";
            send.disabled = false; cancel.disabled = false;
            busy = ""; paintStatus();
            return;
          }
        }
        const rev = await publish(note.value.trim(), function (step) { progress.textContent = step; });
        busy = "";
        close();
        render();
        toast("Published. The online book is now version " + rev + ".");
      } catch (problem) {
        busy = "";
        progress.textContent = "";
        progress.appendChild(h("span", { class: "error" }, problem.message));
        send.disabled = false; cancel.disabled = false;
        send.textContent = "Try again";
        paintStatus();
      }
    });
  });
}

function download(name, text) {
  const link = h("a", { href: URL.createObjectURL(new Blob([text], { type: "application/json" })), download: name });
  document.body.appendChild(link);
  link.click();
  setTimeout(function () { URL.revokeObjectURL(link.href); link.remove(); }, 2000);
}

function pickFile() {
  const input = h("input", { type: "file", accept: ".json,application/json" });
  input.addEventListener("change", function () {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () {
      try {
        const book = JSON.parse(reader.result);
        if (!Array.isArray(book.songs) || !Array.isArray(book.categories) || !book.songs.length || !book.songs[0].id) throw new Error("not a book");
        draft = emptyDraft();
        draft.whole = book;
        keepDraft();
        toast("Opened " + book.songs.length + " mezmurs from the file. When you publish, this file replaces the whole online book.");
        go("");
      } catch (problem) {
        toast("This file is not a mezmur book (mezmurs.json).");
      }
    };
    reader.readAsText(file, "utf-8");
  });
  input.click();
}

function openMenu() {
  sheet(function (box, close) {
    const item = function (title, detail, action) {
      return h("button", { onclick: function () { close(); action(); } }, title, h("small", null, detail));
    };
    const changes = countChanges();
    box.appendChild(h("h2", null, "Menu"));
    box.appendChild(h("div", { class: "menu" },
      item("Connection", conn.owner ? conn.owner + "/" + conn.repo + (conn.token ? " • key saved" : " • no key") : "not set", function () { go("setup"); }),
      item("Read again from online", "Gets the newest book. Your unpublished changes are kept.", function () { loadOnline(false); }),
      item("Download a backup copy", "Saves the book, with your changes, as a file on this device.", function () {
        const book = source();
        if (!book) return toast("There is no book to save.");
        const copy = applyDraft(Object.assign({}, book, { songs: book.songs.slice() }), draft);
        download("mezmurs-backup-v" + (copy.rev || 1) + "-" + today() + ".json", JSON.stringify(copy));
      }),
      item("Open a backup file", "Replaces the whole book with a file. Use it to go back to an older copy.", pickFile),
      changes.total ? item("Throw away my changes", changes.total + " unpublished change" + (changes.total > 1 ? "s" : "") + " on this device", function () {
        sheet(function (inner, shut) {
          inner.appendChild(h("h2", null, "Throw away your changes?"));
          inner.appendChild(h("p", { class: "hint" }, "Everything you did and have not published is removed from this device. The online book is not touched."));
          inner.appendChild(h("div", { class: "foot" },
            h("button", { class: "btn", onclick: shut }, "Keep them"),
            h("button", { class: "btn danger", onclick: function () { draft = emptyDraft(); keepDraft(); shut(); render(); } }, "Throw away")));
        });
      }) : null));
  });
}

$("publish").addEventListener("click", openPublish);
$("menu").addEventListener("click", openMenu);
$("back").addEventListener("click", function () {
  if (formDirty && !confirm("Leave without saving what you typed?")) return;
  formDirty = false;
  go("");
});
window.addEventListener("hashchange", function () { render(); });
window.addEventListener("beforeunload", function (event) { if (formDirty) { event.preventDefault(); event.returnValue = ""; } });

// sw.js keeps a copy of this page in the browser, so it also opens without internet.
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "127.0.0.1" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").catch(function () {});
}

render();
loadOnline(true);
</script>
</body>
</html>
